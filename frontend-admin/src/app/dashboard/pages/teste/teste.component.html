<div class="teste-page">
  <h1 class="teste-page__title">Teste – Time Slot Picker</h1>
  <p class="teste-page__subtitle">Selecione um horário (intervalos de 15, 30 ou 60 min)</p>

  <div class="teste-page__grid">
    <div class="teste-page__card">
      <h2 class="teste-page__card-title">15 min</h2>
      <fuse-time-slot-picker
        [interval]="15"
        [showPeriodLabels]="true"
        (timeSelected)="onTimeSelected($event)"
      />
    </div>
    <div class="teste-page__card">
      <h2 class="teste-page__card-title">30 min</h2>
      <fuse-time-slot-picker
        [interval]="30"
        [value]="'09:00'"
        [showPeriodLabels]="true"
        (timeSelected)="onTimeSelected($event)"
      />
    </div>
    <div class="teste-page__card">
      <h2 class="teste-page__card-title">1 hora</h2>
      <fuse-time-slot-picker
        [interval]="60"
        [showPeriodLabels]="true"
        (timeSelected)="onTimeSelected($event)"
      />
    </div>
  </div>

  @if (selected(); as v) {
    <div class="teste-page__result">
      <strong>Selecionado:</strong> {{ v }}
    </div>
  }
</div>
