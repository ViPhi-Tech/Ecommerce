<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[800px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        Importar Produtos
      </h2>
      <p class="text-sm text-muted-foreground">
        Faça upload de um arquivo para importar produtos
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div class="flex gap-4">
      <p-button
        label="Baixar Modelo"
        icon="pi pi-download"
        (click)="downloadProductsTemplate()"
      ></p-button>

      <p-fileupload
        mode="basic"
        name="file[]"
        chooseIcon="pi pi-upload"
        accept=".xls,.xlsx,.csv"
        maxFileSize="1000000"
        (onSelect)="onFileSelected($event)"
        [auto]="true"
        chooseLabel="Importar"
      />
      <p class="mt-2 text-sm text-muted-foreground">
        Formatos suportados: .xls, .xlsx, .csv
      </p>
      <p class="mt-2 text-sm text-muted-foreground">Tamanho máximo: 1MB</p>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        <button
          pButton
          type="submit"
          label="Importar"
          icon="pi pi-upload"
          class="w-[200px]"
          size="small"
          [disabled]="!selectedFile"
        ></button>

        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDialog($event)"
          severity="secondary"
          [outlined]="true"
          class="w-[200px]"
          size="small"
        ></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
