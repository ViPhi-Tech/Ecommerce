<p-dialog
  #dialogRef
  [header]="title()"
  [(visible)]="visible"
  [draggable]="false"
  (onHide)="onHide()"
  [modal]="true"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  [responsive]="true"
  [closable]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '30vw' }"
>
  <form class="flex flex-col gap-4">
    <!-- Nome do Produto -->
    <div class="flex flex-col gap-2">
      <label for="name" class="font-medium">Nome</label>
      <input
        id="name"
        type="text"
        pInputText
        name="name"
        required
        placeholder="Nome do Produto"
      />
    </div>
    <!-- Descrição do Produto -->
    <div class="flex flex-col gap-2">
      <label for="description" class="font-medium">Descrição</label>
      <textarea
        id="description"
        pTextarea
        name="description"
        required
        placeholder="Descrição do Produto"
        rows="4"
      ></textarea>
    </div>
    <!-- Preço do Produto -->
    <div class="flex flex-col gap-2">
      <label for="price" class="font-medium">Preço</label>
      <input
        id="price"
        type="number"
        pInputText
        name="price"
        required
        placeholder="Preço do Produto"
      />
    </div>
  </form>

  <ng-template #footer>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="submit"
        label="Cadastrar"
        icon="pi pi-check"
        class="w-full"
        severity="success"
      ></button>
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        class="w-full"
        (click)="closeDrawer($event)"
        severity="danger"
      ></button>
    </div>
  </ng-template>
</p-dialog>
