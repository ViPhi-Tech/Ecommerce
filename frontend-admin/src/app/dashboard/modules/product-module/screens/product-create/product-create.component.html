<p-dialog
  #dialogRef
  [header]="title()"
  [(visible)]="visible"
  [draggable]="false"
  (onHide)="onHide()"
  [modal]="true"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  [closable]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '80vw' }"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-lg font-semibold leading-none tracking-tight">
        Adicionar Produto
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados do novo produto abaixo
      </p>
    </div>
  </ng-template>

  <form class="flex flex-col gap-4">
    <div>
      <fuse-section title="Informações Básicas do Produto">
        <form [formGroup]="productForm" class="row">
          <div class="col-12 md:col-6 mb-6">
            <fuse-input
              label="Nome do Produto"
              [control]="productForm.get('name')"
              placeholder="Ex: Smartphone Galaxy S22 Ultra"
            />
          </div>

          <div class="col-12 md:col-6 mb-6">
            <fuse-input
              label="Código/SKU"
              [control]="productForm.get('sku')"
              placeholder="Ex: SM-S22U-256GB-BLK"
            />
          </div>

          <div class="col-12 md:col-6 mb-6">
            <fuse-select
              label="Categoria"
              [control]="productForm.get('category')"
              placeholder="Selecione uma cetegoria"
            />
          </div>

          <div class="col-12 md:col-6 mb-6">
            <fuse-select
              label="Marca / Fabricante"
              [control]="productForm.get('brand')"
              placeholder="Selecione uma marca"
            />
          </div>

          <div class="col-12 md:col-6 mb-6">
            <fuse-input
              type="price"
              label="Preço"
              [control]="productForm.get('price')"
              placeholder="R$ 0,00"
            />
          </div>

          <div class="col-12 md:col-6 mb-6">
            <fuse-input
              label="Estoque disponível"
              type="number"
              [control]="productForm.get('stock')"
              placeholder="Adicione a quantidade disponível"
            />
          </div>

          <div class="col-12 mb-6">
            <fuse-input
              type="textarea"
              label="Descrição curta"
              [control]="productForm.get('shortDescription')"
              placeholder="Breve descrição do produto (máx. 255 caracteres)"
            />
          </div>

          <div class="col-12 mb-6">
            <fuse-input
              type="textarea"
              label="Descrição"
              [rows]="5"
              [control]="productForm.get('description')"
              placeholder="Descrição detalhada do produto, características, benefícios, etc."
            />
          </div>
        </form>
      </fuse-section>
    </div>
  </form>

  <ng-template #footer>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="submit"
        label="Cadastrar"
        icon="pi pi-check"
        class="w-[200px]"
        size="small"
        [raised]="true"
      ></button>
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        (click)="closeDrawer($event)"
        severity="secondary"
        class="w-[200px]"
        size="small"
        [raised]="true"
      ></button>
    </div>
  </ng-template>
</p-dialog>
