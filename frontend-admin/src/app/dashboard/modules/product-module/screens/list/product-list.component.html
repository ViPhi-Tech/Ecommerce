<div class="p-6 animate-fade-in">
  <div class="flex items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">
        Produtos - Listagem
      </h1>
      <p class="text-gray-600 dark:text-gray-400 mt-1">
        Gerencie seus produtos de forma visual e organizada
      </p>
    </div>

    <div class="flex gap-3 ml-auto">
      <p-button
        [text]="true"
        styleClass="h-full"
        (onClick)="refreshProducts()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      >
        <ng-icon name="lucideRefreshCw" />
      </p-button>

      <p-button
        [text]="true"
        icon="pi pi-upload"
        pTooltip="Importar Produtos"
        (onClick)="importProducts()"
      ></p-button>

      <p-button
        icon="pi pi-plus"
        label="Novo Produto"
        (onClick)="addNewProduct()"
        pTooltip="Adicionar novo produto"
        tooltipPosition="bottom"
      />
    </div>
  </div>

  <div class="animate-left">
    <fuse-table
      [title]="title"
      [data]="state.productList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    />
  </div>
</div>

<ng-template #productItem let-item>
  <div
    class="rounded-lg border bg-card text-card-foreground shadow-sm group hover:shadow-xl transition-all duration-300 overflow-hidden"
    data-v0-t="card"
  >
    <div class="relative">
      <img
        alt="Smartphone Galaxy Pro"
        loading="lazy"
        width="300"
        height="200"
        decoding="async"
        data-nimg="1"
        class="w-full h-48 object-cover"
        src="https://g66knp9qlv84vs28z.lite.vusercontent.net/placeholder.svg"
        style="color: transparent"
      />
      <div
        class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-2"
      >
        <button
          (click)="editProduct(item.id)"
          class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 text-secondary-foreground h-9 rounded-md px-3 bg-white/90 hover:bg-white"
        >
          <ng-icon
            name="lucideSquarePen"
            class="h-4 w-4 text-secondary-foreground"
          ></ng-icon>
        </button>
        <button
          (click)="deleteProduct(item.id)"
          class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 h-9 rounded-md px-3 bg-white/90 hover:bg-white text-red-600"
        >
          <ng-icon name="lucideTrash2" class="h-4 w-4 text-red-600"></ng-icon>
        </button>
      </div>
    </div>
    <div class="p-4">
      <div class="space-y-3">
        <div>
          <h3 class="font-semibold text-lg line-clamp-1">
            {{ item.name }}
          </h3>
          <p class="text-sm text-gray-600 line-clamp-2">
            {{ item.shortDescription }}
          </p>
        </div>
        <div class="flex items-center justify-between">
          <div class="text-2xl font-bold text-green-600">
            {{
              item.initialPrice | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR'
            }}
          </div>
          <div class="text-right">
            <p class="text-sm text-gray-600">Estoque</p>
            <p class="font-semibold text-green-600">{{ item.quantity }} un.</p>
          </div>
        </div>
        <div class="pt-2 border-t">
          <p class="text-xs text-gray-500">ID: PROD-{{ item.id }}</p>
        </div>
      </div>
    </div>
  </div>
</ng-template>
