<div class="p-6 animate-fade-in">
  <div class="flex items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">
        Dívidas - Listagem
      </h1>
      <p class="text-gray-600 dark:text-gray-400 mt-1">
        Gerencie suas dívidas e contas a pagar de forma organizada
      </p>
    </div>

    <div class="flex gap-3 ml-auto">
      <p-button
        [text]="true"
        styleClass="h-full"
        (onClick)="refreshDebts()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      >
        <ng-icon name="lucideRefreshCw" />
      </p-button>

      <p-button
        icon="pi pi-plus"
        label="Nova Dívida"
        (onClick)="addNewDebt()"
        pTooltip="Adicionar nova dívida"
        tooltipPosition="bottom"
      />
    </div>
  </div>

  <div class="animate-left">
    <fuse-table
      [data]="filteredDebtList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
      [(selectedData)]="selectedData"
    >
      <ng-container data-headerFilter>
        <div class="flex gap-4 items-center">
          <!-- Sumário de Itens Selecionados -->
          @if (selectedSummary().count > 0) {
            <div class="flex-1 p-3 bg-gradient-to-r from-blue-50 to-indigo-50 dark:from-blue-900/20 dark:to-indigo-900/20 rounded-lg border border-blue-200 dark:border-blue-800 shadow-sm animate-fade-in">
              <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                  <ng-icon name="lucideCheckCheck" class="text-blue-600 dark:text-blue-400" size="18" />
                  <span class="text-xs font-semibold text-gray-700 dark:text-gray-300">
                    {{ selectedSummary().count }} selecionado(s)
                  </span>
                </div>
                
                <div class="flex gap-3 items-center">
                  <!-- Valor Total -->
                  <div class="flex items-center gap-1">
                    <span class="text-xs text-gray-600 dark:text-gray-400">Total:</span>
                    <span class="text-sm font-bold text-green-600 dark:text-green-400">
                      {{ selectedSummary().totalAmount | currency: 'BRL' }}
                    </span>
                  </div>
                </div>
              </div>
            </div>
          }

          <!-- Filtro de Cliente -->
          <div class="flex-shrink-0">
            <p-select
              class="w-full max-w-52"
              [options]="clientOptions()"
              [(ngModel)]="selectedClient"
              optionLabel="label"
              optionValue="value"
              placeholder="Selecione um cliente"
              (onChange)="onClientChange($event.value)"
            >
              <ng-template #selectedItem let-selectedOption>
                <div class="flex items-center gap-2">
                  <ng-icon name="lucideUser" size="16" />
                  <span>{{ selectedOption.label }}</span>
                </div>
              </ng-template>
            </p-select>
          </div>

          <!-- Filtro de Período -->
          <div class="flex-shrink-0 w-64">
            <fuse-period
              [availablePeriods]="[
                'today',
                'yesterday',
                'last7days',
                'last15days',
                'last30days',
                'currentMonth',
                'all',
              ]"
              [placeholder]="'Selecione o período'"
              [defaultValue]="'last30days'"
              (periodChange)="onPeriodChange($event)"
            />
          </div>
        </div>
      </ng-container>
    </fuse-table>
  </div>
</div>
