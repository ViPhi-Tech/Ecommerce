<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[800px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ subtitle() }}
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      <form [formGroup]="debtForm" class="row space-y-4">
        <div class="col-12 md:col-12">
          <fuse-input
            [isLoading]="isLoading()"
            label="Título da Dívida"
            [control]="debtForm.get('title')"
            placeholder="Ex: Pagamento de Fornecedor"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Nome do Credor"
            [control]="debtForm.get('creditorName')"
            placeholder="Ex: Empresa XYZ Ltda"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="CPF/CNPJ do Credor"
            [control]="debtForm.get('creditorDocument')"
            placeholder="Ex: 00.000.000/0000-00"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            type="price"
            label="Valor da Dívida"
            [min]="1"
            [control]="debtForm.get('amount')"
            placeholder="R$ 0,00"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            type="date"
            label="Data de Vencimento"
            [control]="debtForm.get('dueDate')"
            placeholder="Selecione a data"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-select
            label="Status"
            [items]="statusOptions()"
            valueRef="value"
            labelRef="label"
            [isLoading]="isLoading()"
            [control]="debtForm.get('status')"
            placeholder="Selecione o status"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-select
            label="Categoria"
            [items]="categoryState.categoryList()"
            valueRef="id"
            labelRef="name"
            [isLoading]="isLoading()"
            [drawer]="['categories', 'new']"
            [control]="debtForm.get('categoryId')"
            placeholder="Adicione uma categoria"
          />
        </div>

        @if (debtForm.get('status')?.value === 'paid') {
          <div class="col-12 md:col-6">
            <fuse-input
              [isLoading]="isLoading()"
              type="date"
              label="Data de Pagamento"
              [control]="debtForm.get('paidDate')"
              placeholder="Selecione a data"
            />
          </div>
        }

        <div class="col-12">
          <fuse-input
            [isLoading]="isLoading()"
            type="textarea"
            label="Descrição"
            [rows]="4"
            [control]="debtForm.get('description')"
            placeholder="Adicione informações adicionais sobre a dívida"
          />
        </div>
      </form>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        <button
          pButton
          type="submit"
          [label]="submitButtonLabel()"
          icon="pi pi-check"
          class="w-[200px]"
          size="small"
          (click)="onSubmit($event)"
        ></button>

        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDialog($event)"
          severity="secondary"
          [outlined]="true"
          class="w-[200px]"
          size="small"
        ></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
