<div class="p-8 animate-fade-in">
  <form class="flex flex-col gap-4 mt-3 scroll-form">
    <div>
      <form [formGroup]="baseForm" class="row space-y-4">
        <div class="col-12 md:col-12">
          <fuse-input
            [isLoading]="isLoading()"
            label="Nome do Base"
            [control]="baseForm.get('name')"
            placeholder="Ex: Smartphone Galaxy S22 Ultra"
          />
        </div>
      </form>
      <!-- <fuse-section title="Informações Básicas do Base">
        </fuse-section> -->
    </div>
  </form>

  <div class="w-full justify-end flex items-center gap-4 mt-4">
    <div class="flex gap-2">
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        (click)="back()"
        outlined="true"
        severity="secondary"
        class="w-[200px]"
        size="small"
      ></button>

      <button
        pButton
        type="submit"
        [label]="submitButtonLabel()"
        icon="pi pi-check"
        class="w-[200px]"
        size="small"
        (click)="onSubmit($event)"
      ></button>
    </div>
  </div>
</div>

<p-toast baseZIndex="9000" />
