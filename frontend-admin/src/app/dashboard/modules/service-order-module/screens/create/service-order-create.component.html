<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[800px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ subtitle() }}
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      <form [formGroup]="serviceOrderForm" class="row space-y-4">
        <div class="col-12 md:col-12">
          <fuse-input
            [isLoading]="isLoading()"
            label="Cliente"
            [control]="serviceOrderForm.get('client')"
            placeholder="Nome do cliente"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-select
            label="Status"
            [items]="[
              { label: 'Pendente', value: 'pending' },
              { label: 'Em Andamento', value: 'in-progress' },
              { label: 'Concluída', value: 'completed' },
              { label: 'Cancelada', value: 'cancelled' },
            ]"
            [isLoading]="isLoading()"
            [control]="serviceOrderForm.get('status')"
            placeholder="Selecione o status"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-select
            label="Prioridade"
            [items]="[
              { label: 'Baixa', value: 'low' },
              { label: 'Média', value: 'medium' },
              { label: 'Alta', value: 'high' },
            ]"
            [isLoading]="isLoading()"
            [control]="serviceOrderForm.get('priority')"
            placeholder="Selecione a prioridade"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Data de Criação"
            type="date"
            [control]="serviceOrderForm.get('createdDate')"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Data de Vencimento"
            type="date"
            [control]="serviceOrderForm.get('dueDate')"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Responsável"
            [control]="serviceOrderForm.get('assignedTo')"
            placeholder="Nome do responsável"
          />
        </div>

        <div class="col-12">
          <fuse-input
            [isLoading]="isLoading()"
            type="textarea"
            label="Descrição"
            [rows]="3"
            [control]="serviceOrderForm.get('description')"
            placeholder="Descrição da ordem de serviço"
          />
        </div>

        <div class="col-12">
          <fuse-input
            [isLoading]="isLoading()"
            type="textarea"
            label="Observações"
            [rows]="3"
            [control]="serviceOrderForm.get('notes')"
            placeholder="Observações adicionais"
          />
        </div>
      </form>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        <button
          pButton
          type="submit"
          [label]="submitButtonLabel()"
          icon="pi pi-check"
          class="w-[200px]"
          size="small"
          (click)="onSubmit($event)"
        ></button>

        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDialog($event)"
          severity="secondary"
          [outlined]="true"
          class="w-[200px]"
          size="small"
        ></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
