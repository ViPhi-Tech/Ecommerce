 <div class="flex animate-fade-in">
          <div class="w-full p-8 h-[calc(100vh-65px)] overflow-y-auto">
            <fuse-product-search />

                    <p class="text-sm text-muted-foreground">Selecione como deseja receber seu pedido</p>

                    <div role="radiogroup" aria-required="false" dir="ltr" class="grid gap-2" tabindex="0"

                      <div class="space-y-4">
                        <div class="flex items-center space-x-3 p-4 border rounded-lg hover:bg-gray-50">
                          <button type="button" role="radio" aria-checked="false" data-state="unchecked"

                          <label
                            class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 flex items-center gap-3 cursor-pointer flex-1"

                            <ng-icon name="lucideStore" class="h-5 w-5 text-blue-600" />
                            <div>
                              <div class="font-medium">Retirada na Loja</div>
                              <div class="text-sm text-gray-500">Retire seu pedido em nossa loja</div>
                            </div>
                          </label>
                          <span class="text-green-600 font-medium">Grátis</span>
                        </div>
                        <div class="flex items-center space-x-3 p-4 border rounded-lg hover:bg-gray-50">
                          <button type="button" role="radio" aria-checked="false" data-state="unchecked"

                            <div>
                              <div class="font-medium">Delivery</div>
                              <div class="text-sm text-gray-500">Entrega em sua casa</div>
                            </div>
                          </label>
                          <span class="text-gray-600 font-medium">R$ 8,00</span>

                              <div class="font-medium">Entrega Expressa</div>
                              <div class="text-sm text-gray-500">Entrega em até 30 minutos</div>

                          </label>
                          <span class="text-gray-600 font-medium">R$ 15,00</span>
                        </div>
                      </div>

                    </h3>
                    <p class="text-sm text-muted-foreground">Escolha como deseja pagar seu pedido</p>
                  </div>

                      style="outline: none;">

                        <div class="flex items-center space-x-3 p-4 border rounded-lg hover:bg-gray-50">
                          <button type="button" role="radio" aria-checked="false" data-state="unchecked" value="pix"

                            <div>
                              <div class="font-medium">PIX</div>
                              <div class="text-sm text-gray-500">Pagamento instantâneo</div>
                            </div>
                          </label>
                          <span class="text-green-600 text-sm">5% desconto</span>
                        </div>
                        <div class="flex items-center space-x-3 p-4 border rounded-lg hover:bg-gray-50">
                          <button type="button" role="radio" aria-checked="false" data-state="unchecked" value="cartao"

                            <ng-icon name="lucideCreditCard" class="h-5 w-5 text-blue-600" />
                            <div>
                              <div class="font-medium">Cartão de Crédito/Débito</div>
                              <div class="text-sm text-gray-500">Visa, Mastercard, Elo</div>
                            </div>
                          </label>
                        </div>
                        <div class="flex items-center space-x-3 p-4 border rounded-lg hover:bg-gray-50">
                          <button type="button" role="radio" aria-checked="false" data-state="unchecked"
                            value="dinheiro"
                            class="aspect-square h-4 w-4 rounded-full border dark:border-dark text-primary ring-offset-background focus:outline-hidden focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"

                            <ng-icon name="lucideBanknote" class="h-5 w-5 text-green-700" />
                            <div>
                              <div class="font-medium">Dinheiro</div>
                              <div class="text-sm text-gray-500">Pagamento na entrega/retirada</div>
                            </div>
                          </label>
                        </div>
                        <div class="flex items-center space-x-3 p-4 border rounded-lg hover:bg-gray-50">
                          <button type="button" role="radio" aria-checked="false" data-state="unchecked"
                            value="carteira"
                            class="aspect-square h-4 w-4 rounded-full border dark:border-dark text-primary ring-offset-background focus:outline-hidden focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"

                          <label

                            <ng-icon name="lucideWallet" class="h-5 w-5 text-purple-600" />
                            <div>
                              <div class="font-medium">Carteira Digital</div>
                              <div class="text-sm text-gray-500">PicPay, PayPal, Mercado Pago</div>
                            </div>
                          </label>
                        </div>
                      </div>
                    </div>

              </div>
            </div>
          </div>
          <fuse-order-cart />
