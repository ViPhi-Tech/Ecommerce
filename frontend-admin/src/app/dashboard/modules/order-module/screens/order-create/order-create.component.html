<div class="flex animate-fade-in relative">
  <!-- Lista de produtos - ocupa toda a largura no mobile, compartilha espaço no desktop -->
  <div class="w-full lg:w-[calc(100%-400px)] p-4 lg:p-8 h-[calc(100vh-65px)] overflow-y-auto">
    <fuse-product-list />
  </div>

  <!-- Carrinho desktop - visível apenas em telas grandes -->
  <div class="hidden lg:block w-[400px] flex-shrink-0">
    <fuse-order-cart />
  </div>

  <!-- Botão flutuante para abrir carrinho no mobile -->
  <button
    (click)="openCartDrawer()"
    class="lg:hidden fixed bottom-6 right-6 z-50 h-14 w-14 rounded-full bg-primary text-primary-foreground shadow-lg hover:shadow-xl transition-all duration-200 flex items-center justify-center"
    [attr.aria-label]="'Abrir carrinho'"
  >
    <ng-icon name="lucideShoppingCart" class="w-6 h-6" />
    @if (cartState.quantityItems() > 0) {
      <span
        class="absolute -top-1 -right-1 h-6 w-6 rounded-full bg-destructive text-destructive-foreground text-xs font-bold flex items-center justify-center"
      >
        {{ cartState.quantityItems() }}
      </span>
    }
  </button>

  <!-- Drawer do carrinho no mobile -->
  <p-drawer
    [(visible)]="cartDrawerVisible"
    position="right"
    [header]="'Carrinho'"
    [modal]="true"
    [dismissible]="true"
    [showCloseIcon]="true"
    styleClass="!w-full sm:!w-[400px]"
    transitionOptions="300ms cubic-bezier(0, 0, 0.2, 1)"
    (onHide)="closeCartDrawer()"
  >
    <fuse-order-cart />
  </p-drawer>
</div>
