<div class="p-6 animate-fade-in">
  <div class="flex items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">
        Pedidos - Listagem
      </h1>
      <p class="text-gray-600 dark:text-gray-400 mt-1">
        Gerencie seus pedidos de forma visual e organizada
      </p>
    </div>

    <div class="flex gap-3 ml-auto">
      <p-button
        [text]="true"
        styleClass="h-full"
        (onClick)="refreshOrders()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      >
        <ng-icon name="lucideRefreshCw" />
      </p-button>

      <p-button
        icon="pi pi-plus"
        label="Novo Pedido"
        (onClick)="addNewOrder()"
        pTooltip="Criar novo pedido"
        tooltipPosition="bottom"
      />
    </div>
  </div>

  <div class="animate-left">
    <fuse-table
      [data]="filteredOrderList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    >
      <ng-container data-headerFilter>
        <div class="flex gap-4 items-center w-full">
          <div class="flex-shrink-0">
            <p-select
              class="w-full max-w-64"
              [options]="clientOptions()"
              [(ngModel)]="selectedClient"
              optionLabel="label"
              optionValue="value"
              placeholder="Selecione um cliente"
              (onChange)="onClientChange($event.value)"
            >
              <ng-template #selectedItem let-selectedOption>
                <div class="flex items-center gap-2">
                  <ng-icon name="lucideUser" size="16" />
                  <span>{{ selectedOption.label }}</span>
                </div>
              </ng-template>
            </p-select>
          </div>

          <div class="flex-shrink-0">
            <fuse-period
              [availablePeriods]="[
                'today',
                'yesterday',
                'last7days',
                'last15days',
                'last30days',
                'currentMonth',
                'all',
              ]"
              [placeholder]="'Selecione o período'"
              [defaultValue]="'last30days'"
              (periodChange)="onPeriodChange($event)"
            />
          </div>
        </div>
      </ng-container>
    </fuse-table>
  </div>
</div>

<ng-template #payment let-row>
  <div class="flex items-center justify-center gap-2">
    @if (row.payments.length > 1) {
      <p-button [outlined]="true" (onFocus)="popover?.toggle($event)">
        <ng-icon name="lucideInfo" />
      </p-button>
      <p-popover #popover class="absolute">
        <div class="flex gap-2">
          @for (payment of row.payments; track payment.id) {
            @if (payment.name) {
              <p-tag
                [value]="payment.name"
                [severity]="
                  paymentSeverities()[payment.typeId.toUpperCase()]?.severity
                "
              ></p-tag>
            }
          }
        </div>
      </p-popover>
    } @else if (row.payments.length === 1) {
      <p-tag
        [value]="row.payments[0].name"
        [severity]="
          paymentSeverities()[row.payments[0]?.typeId.toUpperCase()]?.severity
        "
      ></p-tag>
    } @else {
      <span>--</span>
    }
  </div>
</ng-template>
