<div class="p-8 animate-fade-in">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold">Lista de Pedidos</h1>
    <div class="flex gap-1">
      <p-button
        [variant]="state.currentView() === 'table' ? undefined : 'outlined'"
        (onClick)="state.setView('table')"
      >
        <ng-icon name="lucideList" />
      </p-button>
      <p-button
        [variant]="state.currentView() === 'list' ? undefined : 'outlined'"
        (onClick)="state.setView('list')"
      >
        <ng-icon name="lucideTable" />
      </p-button>
    </div>
  </div>

  @if (state.currentView() === 'table') {
    <div class="animate-left">
      <fuse-table
        [data]="state.orderList()"
        [loading]="state.loading()"
        [config]="tableConfig()"
      >
        <ng-container data-headerFilter>
          <fuse-table-filter>
            <div class="space-y-4"></div>
          </fuse-table-filter>
        </ng-container>
      </fuse-table>
    </div>
  }
  @if (state.currentView() === 'list') {
    <div class="animate-right space-y-4">
      <div class="ounded-lg border bg-card text-card-foreground shadow-sm">
        <div class="p-6 pt-6">
          <div class="flex flex-col md:flex-row gap-4">
            <div class="flex-1">
              <div class="relative">
                <ng-icon
                  name="lucideSearch"
                  class="absolute left-3 top-2.5 text-muted-foreground"
                ></ng-icon>
                <input
                  class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50 pl-10"
                  placeholder="Buscar por cliente ou número do pedido..."
                  value=""
                />
              </div>
            </div>
            <button
              type="button"
              class="flex h-10 items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm placeholder:text-muted-foreground focus:outline-none disabled:cursor-not-allowed disabled:opacity-50 [&amp;&gt;span]:line-clamp-1 w-full md:w-48"
            >
              <span style="pointer-events: none">Todos os Status</span></button
            ><button
              class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 border border-input bg-background hover:bg-accent hover:text-accent-foreground h-10 px-4 py-2 w-full md:w-auto"
            >
              Mais Filtros
            </button>
          </div>
        </div>
      </div>
      <div
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
      >
        @for (item of state.orderList(); track $index) {
          <ng-container
            *ngTemplateOutlet="orderItem; context: { $implicit: item }"
          >
          </ng-container>
        }
      </div>
    </div>
  }
</div>

<ng-template #orderItem let-item>
  <div
    class="rounded-lg border-gray-200 dark:border-[#1F1F23] bg-card text-card-foreground shadow-sm hover:shadow-lg transition-shadow duration-200"
  >
    <div
      class="flex flex-col space-y-1.5 p-6 bg-green-50 dark:bg-zinc-900 rounded-t-lg"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-semibold">PED-{{item.id}}</span>
        </div>
        <div
          class="inline-flex items-center rounded-full border-gray-200 dark:border-[#1F1F23] px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none hover:bg-primary/80 bg-green-100 text-green-800"
        >
          Entregue
        </div>
      </div>
    </div>
    <div class="p-6 pt-4">
      <div class="space-y-3">
        <div>
          <p class="text-sm text-gray-600">Cliente</p>
          <p class="font-medium">João Silva</p>
        </div>
        <div class="flex justify-between items-center">
          <div>
            <p class="text-sm text-gray-600">Data</p>
            <p class="font-medium">14/01/2024</p>
          </div>
          <div class="text-right">
            <p class="text-sm text-gray-600">Valor</p>
            <p class="font-bold text-lg text-green-600">R$&nbsp;299,90</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
