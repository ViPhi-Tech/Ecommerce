<div class="p-8">
  <fuse-table
    [data]="state.orderList()"
    [loading]="state.loading()"
    [config]="tableConfig()"
  >
    <ng-container data-headerFilter>
      <fuse-table-filter>
        <div class="space-y-4"></div>
      </fuse-table-filter>
    </ng-container>
  </fuse-table>
</div>

<ng-template #name let-product>
  <div class="flex items-center">
    <div class="flex items-center gap-3">
      <img
        [alt]="product?.name"
        loading="lazy"
        decoding="async"
        data-nimg="1"
        class="h-[40px] w-[40px] rounded-md"
        src="https://kzmqjhjoo59803yt4ajr.lite.vusercontent.net/placeholder.svg?height=200&width=200"
        style="color: transparent"
      />
      {{ product?.name }}
    </div>
  </div>
</ng-template>
