<div class="p-4 sm:p-6 animate-fade-in">
  <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-0">
    <div class="flex-1 min-w-0">
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-gray-200 truncate">
        Pedidos - Listagem
      </h1>
      <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mt-1">
        Gerencie seus pedidos de forma visual e organizada
      </p>
    </div>

    <div class="flex gap-2 sm:gap-3 sm:ml-auto flex-wrap sm:flex-nowrap">
      <p-button
        [text]="true"
        styleClass="h-full"
        (onClick)="refreshOrders()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      >
        <ng-icon name="lucideRefreshCw" />
      </p-button>

      <p-button
        icon="pi pi-plus"
        label="Novo Pedido"
        (onClick)="addNewOrder()"
        pTooltip="Criar novo pedido"
        tooltipPosition="bottom"
        class="flex-1 sm:flex-initial"
      />
    </div>
  </div>

  <div class="animate-left mt-4 sm:mt-6">
    <fuse-table
      [data]="filteredOrderList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    >
      <ng-container data-headerFilter>
        <div class="flex gap-4 items-center w-full">
          <div class="flex-shrink-0">
            <fuse-client-select [(selectedClient)]="selectedClient" />
          </div>

          <div class="flex-shrink-0">
            <fuse-period
              [availablePeriods]="[
                'today',
                'yesterday',
                'last7days',
                'last15days',
                'last30days',
                'currentMonth',
                'all',
              ]"
              [placeholder]="'Selecione o período'"
              [defaultValue]="'last30days'"
              (periodChange)="onPeriodChange($event)"
            />
          </div>
        </div>
      </ng-container>
    </fuse-table>
  </div>
</div>

<ng-template #payment let-row>
  <div class="flex items-center justify-center gap-2">
    @if (row.payments.length > 1) {
      <p-button [outlined]="true" (onFocus)="popover?.toggle($event)">
        <ng-icon name="lucideEye" />
      </p-button>
      <p-popover #popover class="absolute">
        <div class="flex gap-2">
          @for (payment of row.payments; track payment.id) {
            @if (payment.name) {
              <p-tag
                [value]="payment.name"
                [severity]="
                  paymentSeverities()[payment.typeId.toUpperCase()]?.severity
                "
              ></p-tag>
            }
          }
        </div>
      </p-popover>
    } @else if (row.payments.length === 1) {
      <p-tag
        [value]="row.payments[0].name"
        [severity]="
          paymentSeverities()[row.payments[0]?.typeId.toUpperCase()]?.severity
        "
      ></p-tag>
    } @else {
      <span>--</span>
    }
  </div>
</ng-template>
