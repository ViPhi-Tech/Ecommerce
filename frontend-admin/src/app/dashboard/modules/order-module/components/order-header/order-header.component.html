<div class="flex items-center justify-between px-2 mb-4">
  <div class="grid gap-1">
    <p class="text-lg text-muted-foreground dark:text-muted">
      Selecione os itens do pedido
    </p>
  </div>
  <div class="flex gap-2">
    <div class="w-[400px] mx-auto p-6">
      <div class="relative">
        <div class="absolute top-8 left-0 w-full h-0.5 bg-gray-200">
          <div
            class="h-full bg-green-500 transition-all duration-500 ease-in-out"
            [style.width.%]="completePercent()"
          ></div>
        </div>
        <div class="relative flex justify-between">
          @for (step of orderSteps(); track $index) {
            <button class="order-step flex flex-col items-center group w-[55px] step"
              (click)="selectStep(step)"
              [ngClass]="{'completed': step.completed, 'active': step.active, 'disabled': !step.active && !step.completed}"
            >
              <div
                class="icon"
              >
                <ng-icon [name]="step.icon" size="18"></ng-icon>
              </div>
              <div class="mt-3 text-center">
                <p
                  class="text"
                >
                  {{ step.label }}
                </p>
              </div>
            </button>
          }
        </div>
      </div>
      <div class="md:hidden mt-8">
        <div class="space-y-4">
          <div class="flex items-center space-x-4">
            <div
              class="flex items-center justify-center w-12 h-12 rounded-full border-2 transition-all duration-300 bg-green-500 border-green-500 text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-user w-5 h-5"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="flex-1">
              <p
                class="font-medium transition-colors duration-300 text-green-600"
              >
                Cliente
              </p>
              <p class="text-sm text-gray-500">Etapa 1</p>
            </div>
            <div
              class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-circle-check-big w-4 h-4 text-white"
              >
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <path d="m9 11 3 3L22 4"></path>
              </svg>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <div
              class="flex items-center justify-center w-12 h-12 rounded-full border-2 transition-all duration-300 bg-green-500 border-green-500 text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-package w-5 h-5"
              >
                <path d="m7.5 4.27 9 5.15"></path>
                <path
                  d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"
                ></path>
                <path d="m3.3 7 8.7 5 8.7-5"></path>
                <path d="M12 22V12"></path>
              </svg>
            </div>
            <div class="flex-1">
              <p
                class="font-medium transition-colors duration-300 text-green-600"
              >
                Produtos
              </p>
              <p class="text-sm text-gray-500">Etapa 2</p>
            </div>
            <div
              class="w-6 h-6 bg-green-500 rounded-full flex items-center justify-center"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-circle-check-big w-4 h-4 text-white"
              >
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <path d="m9 11 3 3L22 4"></path>
              </svg>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <div
              class="flex items-center justify-center w-12 h-12 rounded-full border-2 transition-all duration-300 bg-blue-500 border-blue-500 text-white"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-truck w-5 h-5"
              >
                <path
                  d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"
                ></path>
                <path d="M15 18H9"></path>
                <path
                  d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"
                ></path>
                <circle cx="17" cy="18" r="2"></circle>
                <circle cx="7" cy="18" r="2"></circle>
              </svg>
            </div>
            <div class="flex-1">
              <p
                class="font-medium transition-colors duration-300 text-blue-600"
              >
                Entrega
              </p>
              <p class="text-sm text-gray-500">Etapa 3</p>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <div
              class="flex items-center justify-center w-12 h-12 rounded-full border-2 transition-all duration-300 bg-white border-gray-300 text-gray-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-credit-card w-5 h-5"
              >
                <rect width="20" height="14" x="2" y="5" rx="2"></rect>
                <line x1="2" x2="22" y1="10" y2="10"></line>
              </svg>
            </div>
            <div class="flex-1">
              <p
                class="font-medium transition-colors duration-300 text-gray-400"
              >
                Pagamento
              </p>
              <p class="text-sm text-gray-500">Etapa 4</p>
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <div
              class="flex items-center justify-center w-12 h-12 rounded-full border-2 transition-all duration-300 bg-white border-gray-300 text-gray-400"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-circle-check-big w-5 h-5"
              >
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <path d="m9 11 3 3L22 4"></path>
              </svg>
            </div>
            <div class="flex-1">
              <p
                class="font-medium transition-colors duration-300 text-gray-400"
              >
                Resumo
              </p>
              <p class="text-sm text-gray-500">Etapa 5</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
