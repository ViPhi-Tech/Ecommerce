<div
  class="relative group"
  (mouseenter)="showSteps.set(true)"
  (mouseleave)="showSteps.set(false)"
>
  <div
    class="h-6 absolute top-[50%] text-center left-[50%] translate-x-[-50%] rounded-md border-b border-l border-r border-primary w-20"
  >
    <ng-icon name="matKeyboardArrowDownOutline" size="20" />
  </div>

  @if (showSteps()) {
    <div class="steps-container left-[50%] translate-x-[-50%]">
      <div class="relative">
        <div class="absolute top-8 left-0 w-full h-0.5 bg-gray-200">
          <div
            class="h-full bg-green-500 transition-all duration-500 ease-in-out"
            [style.width.%]="completePercent()"
          ></div>
        </div>
        <div class="relative flex justify-between">
          @for (step of orderSteps(); track $index) {
            <button
              class="order-step flex flex-col items-center group w-[55px] step"
              (click)="selectStep(step)"
              [ngClass]="{
                completed: step.completed,
                active: step.active,
                disabled: !step.active && !step.completed,
              }"
            >
              <div class="icon">
                <ng-icon [name]="step.icon" size="18"></ng-icon>
              </div>
              <div class="mt-3 text-center">
                <p class="text">
                  {{ step.label }}
                </p>
              </div>
            </button>
          }
        </div>
      </div>
    </div>
  }
</div>
