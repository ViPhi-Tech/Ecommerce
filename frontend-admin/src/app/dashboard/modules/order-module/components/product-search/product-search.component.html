<p-select
  [options]="products"
  optionLabel="name"
  [formControl]="selectedProduct"
  [filter]="true"
  filterBy="name"
  [showClear]="true"
  placeholder="Pesquise um produto"
  class="w-full"
  emptyMessage="Nenhum produto correspondente foi encontrado"
  emptyFilterMessage="Nenhum produto correspondente foi encontrado"
>
  <ng-template let-products #item>
    <div class="flex justify-between items-end w-full">
      <div class="flex flex-col">
        <span class="font-medium">{{ products?.name }}</span>
        <span class="text-sm text-gray-500">{{ products?.description }}</span>
      </div>
      <span class="font-medium text-gray-500 flex">{{
        products?.price | currency: 'BRL'
      }}</span>
    </div>
  </ng-template>
</p-select>
