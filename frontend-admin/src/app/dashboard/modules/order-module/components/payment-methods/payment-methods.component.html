<!-- Botão de seleção de forma de pagamento -->
<button
  type="button"
  class="flex items-center space-x-3 p-4 border rounded-lg hover:bg-gray-50 cursor-pointer w-full text-left"
  [class.border-blue-500]="cartState.paymentMethod()"
  [class.bg-blue-50]="cartState.paymentMethod()"
  [class.border-dashed]="!cartState.paymentMethod()"
  [class.border-gray-300]="!cartState.paymentMethod()"
  (click)="visible.set(true)"
>
  @if (cartState.paymentMethod(); as selected) {
    <!-- Forma de pagamento selecionada -->    <div class="flex items-center gap-3 flex-1 ml-4">
      <ng-icon
        [name]="selected.icon"
        [class]="'h-5 w-5'"
        [style.color]="selected.iconColor"
      />
      <div>
        <div class="font-medium">{{ selected.name }}</div>
        <div class="text-sm text-gray-500">
          {{ selected.description }}
        </div>
      </div>
    </div>    @if (selected.discount) {
      <span [style.color]="selected.discountColor" class="text-sm">{{
        selected.discount
      }}</span>
    }
  } @else {
    <!-- Placeholder quando nenhuma forma está selecionada -->
    <div class="flex items-center gap-3 flex-1 ml-4">
      <ng-icon name="lucideCreditCard" class="h-5 w-5 text-gray-400" />
      <div>
        <div class="font-medium text-gray-600">
          Selecionar forma de pagamento
        </div>
        <div class="text-sm text-gray-400">Clique para escolher como pagar</div>
      </div>
    </div>
  }

  <ng-icon name="lucideChevronDown" class="h-4 w-4 text-gray-400" />
</button>

<p-dialog
  header="Selecione uma forma de pagamento"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '100%', maxWidth: '600px' }"
>
  <ng-template #headless>
    <div class="flex flex-col space-y-1.5 p-6">
      <h3
        class="text-2xl font-semibold leading-none tracking-tight flex items-center gap-2"
      >
        <ng-icon name="lucideCreditCard" class="h-5 w-5" />
        Forma de Pagamento
      </h3>
      <p class="text-sm text-muted-foreground">
        Escolha como deseja pagar seu pedido
      </p>
    </div>
    <div class="p-6 pt-0">
      <div class="grid gap-2" style="outline: none">
        <div class="space-y-4">
          @for (paymentMethod of paymentMethods(); track paymentMethod.id) {
            <button
              (click)="onPaymentMethodChange(paymentMethod)"
              class="w-full flex space-x-3 py-4 px-6 border rounded-lg hover:bg-gray-50"
              [class.border-blue-500]="
                cartState.paymentMethod()?.id === paymentMethod.id
              "
              [class.bg-blue-50]="
                cartState.paymentMethod()?.id === paymentMethod.id
              "
            >
              <label
                class="text-sm font-medium text-left leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 flex items-center gap-3 cursor-pointer flex-1"
                [for]="paymentMethod.id"
              >                <ng-icon
                  [name]="paymentMethod.icon"
                  [class]="'h-5 w-5'"
                  [style.color]="paymentMethod.iconColor"
                />
                <div>
                  <div class="font-medium">{{ paymentMethod.name }}</div>
                  <div class="text-sm text-gray-500">
                    {{ paymentMethod.description }}
                  </div>
                </div>
              </label>              @if (paymentMethod.discount) {
                <span [style.color]="paymentMethod.discountColor" class="text-sm">{{
                  paymentMethod.discount
                }}</span>
              }
            </button>
          }
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <p-button
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (click)="visible.set(false)"
        />
      </div>
    </div>
  </ng-template>
</p-dialog>
