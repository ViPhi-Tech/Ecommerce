<div class="flex flex-col space-y-1.5 p-6 animate-fade-in">
  <h3
    class="text-2xl font-semibold leading-none tracking-tight flex items-center gap-2"
  >
    <ng-icon name="lucideTruck" class="h-5 w-5" />
    Tipo de Entrega
  </h3>
  <p class="text-sm text-muted-foreground">
    Selecione como deseja receber seu pedido
  </p>
</div>
<div class="p-6 pt-0 animate-fade-in">
  <div class="grid gap-2" style="outline: none">
    <div class="space-y-4">
      @for (deliveryType of deliveryTypes(); track deliveryType.id) {
        <button
          (click)="onDeliveryTypeChange(deliveryType)"
          class="w-full flex space-x-3 py-4 px-6 border rounded-lg hover:bg-gray-50"
          [class.border-blue-500]="
            cartState.deliveryType()?.id === deliveryType.id
          "
          [class.bg-blue-50]="
            cartState.deliveryType()?.id === deliveryType.id
          "
        >
          <label
            class="text-sm font-medium text-left leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 flex items-center gap-3 cursor-pointer flex-1"
            [for]="deliveryType.id"
          >
            <ng-icon
              [name]="deliveryType.icon"
              [class]="'h-5 w-5'"
              [style.color]="deliveryType.iconColor"
            />
            <div>
              <div class="font-medium">{{ deliveryType.name }}</div>
              <div class="text-sm text-gray-500">
                {{ deliveryType.description }}
              </div>
            </div>
          </label>
          <span
            [style.color]="deliveryType.priceColor"
            class="font-medium"
            >{{ deliveryType.priceLabel }}</span
          >
        </button>
      }
    </div>
  </div>
</div>
