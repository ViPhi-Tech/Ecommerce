<div class="flex flex-col sm:flex-row gap-3 sm:space-x-4 sm:space-y-0">
  <p-iconfield class="small" iconPosition="left" class="w-full sm:flex-1">
    <p-inputicon class="pi pi-search" />
    <input
      pInputText
      pSize="small"
      type="text"
      class="w-full"
      [formControl]="searchControl"
      (input)="onSearchChange($event)"
      placeholder="Buscar produto por nome, categoria ou código..."
    />
  </p-iconfield>
  <fuse-select
    addictionalClass="w-full sm:min-w-[200px] sm:w-auto"
    placeholder="Filtrar por"
    [items]="filters()"
    [canSearch]="false"
    (changeValue)="onFilterChange($event)"
    [control]="filterSelected"
  />
</div>
