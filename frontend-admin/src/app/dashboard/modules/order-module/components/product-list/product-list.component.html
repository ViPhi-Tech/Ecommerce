<div>
  <h2 class="text-xl font-semibold mb-4">Todos os produtos</h2>
  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
  >
    @for (product of products; track $index) {
      <div
        class="rounded-lg border bg-card text-card-foreground shadow-sm overflow-hidden"
      >
        <div class="aspect-square relative"></div>
        <div class="p-4">
          <h3 class="font-medium line-clamp-2 min-h-[48px]">
            {{ product?.name }}
          </h3>
          <p class="text-muted-foreground text-sm">{{ product?.category }}</p>
        </div>
        <div class="p-4 pt-0 flex justify-between items-center">
          <span class="font-bold text-lg">{{
            product?.price | currency: 'BRL' : 'symbol' : '1.2-2' : 'pt-BR'
          }}</span>
          <p-button (onClick)="addProductToCart(product)" label="Comprar" size="small" icon="pi pi-cart-arrow-down"></p-button>
        </div>
      </div>
    }
  </div>
</div>
