<div class="space-y-6 max-w-5xl mx-auto">
  <div
    class="relative border rounded-lg overflow-hidden transition-opacity opacity-100"
  >
    <div class="absolute top-2 right-2 z-10 flex gap-2">
      <button
        class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none  [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 bg-secondary text-secondary-foreground hover:bg-secondary/80 h-8 w-8 rounded-full opacity-70 hover:opacity-100"
        draggable="true"
      >
        <ng-icon name="lucideMove" />
        <span class="sr-only">Mover</span>
      </button>
      <button
        class="inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium  transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none bg-red-600 text-white-foreground hover:bg-red/90 h-8 w-8 rounded-full opacity-70 hover:opacity-100"
      >
        <ng-icon name="lucideX" class="text-white"/>
        <span class="sr-only">Remover</span>
      </button>
    </div>
    <div
      class="relative h-[400px] w-full bg-cover bg-center flex items-center justify-center"
      [style.background-image]="'url(' + backgroundImage() + ')'"
      style="color: white"
    >
      <div class="absolute inset-0 bg-black bg-opacity-40"></div>
      <div class="relative text-center px-6 max-w-3xl">
        @if (title()) {
          <h2 class="text-4xl font-bold mb-4">{{ title() }}</h2>
        }
        @if (subtitle()) {
          <p class="text-xl mb-6">{{ subtitle() }}</p>
        }
        @if (buttonText()) {
          <p-button [label]="buttonText()" [severity]="buttonColor()" />
        }
      </div>
    </div>
  </div>
</div>
