<div
  #dayFloatTrigger="floatUi"
  [floatUi]="eventDetailContent"
  [showTrigger]="NgxFloatUiTriggers.none"
  [targetElement]="floatTargetOrAnchor"
  [hideOnClickOutside]="!dateTimeEditorVisible()"
  [hideOnScroll]="true"
  [placement]="NgxFloatUiPlacements.AUTOEND"
  class="day-float-trigger"
></div>

<float-ui-content #eventDetailContent>
  @if (selectedDay(); as day) {
    <div class="day-float-panel">
      <div class="day-float-panel__header">
        <button class="day-float-panel__close" (click)="hide()">
          <i class="pi pi-times"></i>
        </button>
      </div>

      <div class="day-float-panel__title-row">
        <input
          type="text"
          pInputText
          class="day-float-panel__title-input"
          placeholder="Adicionar título e horário"
          [ngModel]="eventForm().title"
          (ngModelChange)="updateEventForm('title', $event)"
        />
      </div>

      <div class="day-float-panel__rows">
        <div class="day-float-panel__row" (click)="toggleDateTimeEditor()" (keydown.enter)="toggleDateTimeEditor()" tabindex="0" role="button">
          <i class="pi pi-clock day-float-panel__row-icon"></i>
          @if (!dateTimeEditorVisible()) {
            <div class="day-float-panel__row-content">
              <span class="day-float-panel__row-text">
                {{ capitalizeFirst(formattedSelectedDate()) }}
              </span>
            </div>
          }
          @if (dateTimeEditorVisible()) {
            <div class="day-float-panel__datetime-inputs" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()">
              <p-datepicker
                [ngModel]="formDateValue()"
                (ngModelChange)="onDateChange($event)"
                dateFormat="dd/mm/yy"
                [iconDisplay]="'input'"
                [showIcon]="true"
                appendTo="body"
                size="small"
              />
              <div class="day-float-panel__time-row">
                <p-datepicker
                  [ngModel]="formStartTime()"
                  (ngModelChange)="onStartTimeChange($event)"
                  [timeOnly]="true"
                  appendTo="body"
                  placeholder="Início"
                  size="small"
                  [iconDisplay]="'input'"
                  [showIcon]="true"
                >
                  <ng-template #inputicon>
                    <i class="pi pi-clock"></i>
                  </ng-template>
                </p-datepicker>
                <span class="day-float-panel__time-separator">–</span>
                <p-datepicker
                  [ngModel]="formEndTime()"
                  (ngModelChange)="onEndTimeChange($event)"
                  [timeOnly]="true"
                  appendTo="body"
                  placeholder="Fim"
                  size="small"
                  [iconDisplay]="'input'"
                  [showIcon]="true"
                >
                  <ng-template #inputicon>
                    <i class="pi pi-clock"></i>
                  </ng-template>
                </p-datepicker>
              </div>
            </div>
          }
        </div>

        <div class="day-float-panel__row">
          <i class="pi pi-calendar day-float-panel__row-icon"></i>
          <p-checkbox
            [ngModel]="eventForm().allDay"
            (ngModelChange)="updateEventForm('allDay', $event)"
            [binary]="true"
            label="Dia inteiro"
          />
          <span class="day-float-panel__row-text">Dia inteiro</span>
        </div>

        <div class="day-float-panel__row">
          <i class="pi pi-align-left day-float-panel__row-icon"></i>
          @if (!descriptionEditorVisible()) {
            <span (click)="toggleDescriptionEditor()" (keydown.enter)="toggleDescriptionEditor()" tabindex="0" role="button" class="day-float-panel__row-placeholder">Adicionar descrição</span>
          }
          @if (descriptionEditorVisible()) {
            <div class="day-float-panel__editor-wrapper">
              <fuse-text-editor
                [value]="eventForm().description"
                (valueChange)="updateEventForm('description', $event)"
                placeholder="Adicionar descrição"
              />
            </div>
          }
        </div>
      </div>

      <div class="day-float-panel__footer">
        @if (editingEventId()) {
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            size="small"
            (onClick)="onDelete()"
          />
        }
        <p-button
          [label]="editingEventId() ? 'Atualizar' : 'Salvar'"
          size="small"
          (onClick)="onSave()"
        />
      </div>
    </div>
  }
</float-ui-content>
