<div class="p-6 space-y-6 animate-fade-in">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Dashboard</h1>
    <p class="text-gray-600 dark:text-gray-400">Visão geral do seu negócio</p>
  </div>

  <!-- Indicadores Principais -->
  <fuse-indicators [indicators]="indicators()"></fuse-indicators>

  <!-- Gráficos Principais -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
    <!-- Gráfico de Vendas -->
    <fuse-sales-chart></fuse-sales-chart>

    <!-- Gráfico de Produtos Mais Vendidos -->
    <fuse-top-products-chart></fuse-top-products-chart>
  </div>

  <!-- Gráficos Secundários -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Gráfico de Categorias -->
    <fuse-categories-chart></fuse-categories-chart>

    <!-- Gráfico de Status de Pedidos -->
    <fuse-order-status-chart></fuse-order-status-chart>
  </div>

  <!-- Resumo de Atividades Recentes -->
  <div
    class="bg-white dark:bg-gray-800 rounded-lg p-6 shadow-sm border border-gray-200 dark:border-gray-700"
  >
    <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4">
      Atividades Recentes
    </h2>
    <div class="space-y-4">
      <div class="flex items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
        <div class="w-2 h-2 bg-green-500 rounded-full mr-3"></div>
        <div class="flex-1">
          <p class="text-sm font-medium text-gray-900 dark:text-white">
            Novo pedido #1234 foi processado
          </p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Há 5 minutos</p>
        </div>
      </div>
      <div class="flex items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
        <div class="w-2 h-2 bg-blue-500 rounded-full mr-3"></div>
        <div class="flex-1">
          <p class="text-sm font-medium text-gray-900 dark:text-white">
            Cliente João Silva se cadastrou
          </p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Há 12 minutos</p>
        </div>
      </div>
      <div class="flex items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
        <div class="w-2 h-2 bg-yellow-500 rounded-full mr-3"></div>
        <div class="flex-1">
          <p class="text-sm font-medium text-gray-900 dark:text-white">
            Estoque baixo: Smartphone Galaxy
          </p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Há 25 minutos</p>
        </div>
      </div>
      <div class="flex items-center p-3 bg-gray-50 dark:bg-gray-700 rounded-lg">
        <div class="w-2 h-2 bg-purple-500 rounded-full mr-3"></div>
        <div class="flex-1">
          <p class="text-sm font-medium text-gray-900 dark:text-white">
            Relatório mensal foi gerado
          </p>
          <p class="text-xs text-gray-500 dark:text-gray-400">Há 1 hora</p>
        </div>
      </div>
    </div>
  </div>
</div>
