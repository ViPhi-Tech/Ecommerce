<div
  class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-4 gap-4 mb-8"
>
  <!-- Skeleton Loading State -->
  @if (loading) {
    @for (skeleton of [1, 2, 3, 4]; track $index) {
      <div
        class="bg-white dark:bg-gray-800 rounded-lg p-6 shadow-sm border border-gray-200 dark:border-gray-700"
      >
        <div class="flex items-center justify-between">
          <div class="flex-1">
            <!-- Title Skeleton -->
            <div
              class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mb-3 skeleton-element"
            ></div>
            <!-- Value Skeleton -->
            <div
              class="h-8 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mb-3 skeleton-element"
            ></div>
            <!-- Trend Skeleton -->
            <div class="flex items-center">
              <div
                class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-16 mr-2 skeleton-element"
              ></div>
              <div
                class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-24 skeleton-element"
              ></div>
            </div>
          </div>
          <!-- Icon Skeleton -->
          <div
            class="w-12 h-12 bg-gray-200 dark:bg-gray-700 rounded-full flex-shrink-0 skeleton-element"
          ></div>
        </div>
      </div>
    }
  }

  <!-- Actual Content -->
  @if (!loading) {
    @for (indicator of indicators; track $index) {
      <div
        class="bg-white dark:bg-gray-800 rounded-lg p-6 shadow-sm border border-gray-200 dark:border-gray-700"
      >
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600 dark:text-gray-400">
              {{ indicator.title }}
            </p>
            <p class="text-2xl font-bold text-gray-900 dark:text-white">
              {{ indicator.value }}
            </p>
            <!-- <div class="flex items-center mt-2">
              <span
                [class]="
                  indicator.trend === 'up' ? 'text-green-600' : 'text-red-600'
                "
                class="text-sm font-medium"
              >
                {{ indicator.percentage }}
              </span>
              <span class="text-xs text-gray-500 dark:text-gray-400 ml-2"
                >vs. mês anterior</span
              >
            </div> -->
          </div>
          <div
            [class]="
              indicator.trend === 'up'
                ? 'bg-green-100 text-green-600'
                : 'bg-red-100 text-red-600'
            "
            class="p-3 rounded-full"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                *ngIf="indicator.trend === 'up'"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"
              />
              <path
                *ngIf="indicator.trend === 'down'"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"
              />
            </svg>
          </div>
        </div>
      </div>
    }
  }
</div>
