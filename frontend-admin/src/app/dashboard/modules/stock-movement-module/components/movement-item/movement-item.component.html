<div
  class="rounded-lg border bg-card dark:bg-dark dark:border-dark text-card-foreground shadow-2xs border-l-4 border-l-gray-200 hover:shadow-md transition-shadow"
  data-v0-t="card"
>
  <div class="p-4">
    <div
      class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4"
    >
      <div class="flex items-start gap-4">
        <div class="flex flex-col items-center gap-1">
          <div
            class="rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-hidden focus:ring-2 focus:ring-ring focus:ring-offset-2 hover:bg-primary/80 bg-green-100 text-green-800 border-green-200 flex items-center gap-1"
          >
            <ng-icon name="lucideArrowUp" class="h-4 w-4"></ng-icon>
            Entrada
          </div>
          <span class="text-xs text-gray-500">14:30</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <h3 class="font-semibold text-gray-900 truncate">
              Notebook Dell Inspiron 15
            </h3>
            <div
              class="inline-flex items-center rounded-full border px-2.5 py-0.5 font-semibold transition-colors focus:outline-hidden focus:ring-2 focus:ring-ring focus:ring-offset-2 text-foreground text-xs"
              data-v0-t="badge"
            >
              NB001
            </div>
          </div>
          <div
            class="grid grid-cols-1 md:grid-cols-3 gap-2 text-sm text-gray-600"
          >
            <div class="flex items-center gap-1">
              <ng-icon name="lucideCalendar" class="h-3 w-3"></ng-icon>
              2024-01-15
            </div>
            <div class="flex items-center gap-1">
              <ng-icon name="lucidePackage" class="h-3 w-3"></ng-icon>
              Qtd: 5
            </div>
            <div class="flex items-center gap-1">
              <ng-icon name="lucideMapPin" class="h-3 w-3"></ng-icon>
              NF-e 12345
            </div>
          </div>
          <div class="flex items-center gap-1 mt-1 text-xs text-gray-500">
            <ng-icon name="lucideUser" class="h-3 w-3"></ng-icon>
            João Silva
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button
          class="ring-offset-background focus-visible:outline-hidden focus-visible:ring-ring inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 border-input bg-background hover:bg-accent hover:text-accent-foreground border h-9 rounded-md px-3"
        >
          <ng-icon name="lucideEye" class="h-4 w-4 mr-1"></ng-icon>
          Visualizar</button
        ><button
          class="ring-offset-background focus-visible:outline-hidden focus-visible:ring-ring inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 border-input bg-background hover:bg-accent hover:text-accent-foreground border h-9 rounded-md px-3"
        >
          <ng-icon name="lucideRotateCcw" class="h-4 w-4 mr-1"></ng-icon>
          Estornar</button
        ><button
          class="ring-offset-background focus-visible:outline-hidden focus-visible:ring-ring inline-flex items-center justify-center gap-2 whitespace-nowrap text-sm font-medium transition-colors focus-visible:ring-2 focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 border-input bg-background hover:bg-accent hover:text-accent-foreground border h-9 rounded-md px-3"
        >
          <ng-icon name="lucidePrinter" class="h-4 w-4 mr-1"></ng-icon>
          Imprimir
        </button>
      </div>
    </div>
  </div>
</div>
