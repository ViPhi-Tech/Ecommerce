<div class="p-8 animate-fade-in flex flex-col space-y-4 flex-grow">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 animate-left">
    <fuse-simple-indicator
      [loading]="state.loadingCards()"
      title="Saldo Total"
      [value]="state.cardsData()?.stockTotal || 0"
      variant="info"
      icon="lucidePackage"
    ></fuse-simple-indicator>

    <fuse-simple-indicator
      [loading]="state.loadingCards()"
      title="Entradas no Mês"
      [value]="state.cardsData()?.movimentIn || 0"
      variant="success"
      icon="lucideArrowUp"
    ></fuse-simple-indicator>

    <fuse-simple-indicator
      [loading]="state.loadingCards()"
      title="Saídas no Mês"
      [value]="state.cardsData()?.movimentOut || 0"
      variant="error"
      icon="lucideArrowDown"
    ></fuse-simple-indicator>
  </div>

  <div class="animate-left flex flex-col flex-1">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold">Listagem de Movimentações</h1>
      <div>
        <form [formGroup]="formFilter" class="flex items-center gap-4">
          <p-button
            label="Importar NFe"
            icon="pi pi-upload"
            (onClick)="openImportModal()"
            size="small"
            severity="info"
          ></p-button>
          <p-button
            label="Nova Entrada"
            (onClick)="newInbound()"
            size="small"
          ></p-button>
          <p-button
            label="Nova Saída"
            severity="danger"
            (onClick)="newOutbound()"
            size="small"
          ></p-button>
          <fuse-datepicker
            placeholder="Filtrar por data"
            [maxDate]="maxDate()"
            [control]="formFilter.get('date')"
          />
          <fuse-select
            addictionalClass="min-w-[200px]"
            placeholder="Filtrar por"
            [items]="movementTypes()"
            [canSearch]="false"
            [control]="formFilter.get('type')"
          />
        </form>
      </div>
    </div>

    <div class="flex-1 flex flex-col">
      <!-- Botões de alternância de visualização -->
      <div class="flex gap-2 mb-4 view-toggle-buttons">
        <p-button
          [label]="'Visualização em Cards'"
          [icon]="'pi pi-th-large'"
          [outlined]="activeViewMode !== 'cards'"
          [severity]="activeViewMode === 'cards' ? 'primary' : 'secondary'"
          (onClick)="setViewMode('cards')"
          size="small"
        />
        <p-button
          [label]="'Visualização em Tabela'"
          [icon]="'pi pi-table'"
          [outlined]="activeViewMode !== 'table'"
          [severity]="activeViewMode === 'table' ? 'primary' : 'secondary'"
          (onClick)="setViewMode('table')"
          size="small"
        />
      </div>

      <!-- Conteúdo das visualizações -->
      <div class="flex-1 flex flex-col view-content">
        @if (activeViewMode === 'cards') {
          <!-- Visualização em Cards -->
          <div class="flex-1 flex flex-col space-y-4">
            @if (state.loading()) {
              <div class="flex flex-col gap-4">
                <fuse-movement-item [loading]="true" />
                <fuse-movement-item [loading]="true" />
                <fuse-movement-item [loading]="true" />
              </div>
            }

            @for (item of state.stockMovementList(); track $index) {
              <div>
                <fuse-movement-item [item]="item" [index]="$index" />
              </div>
            } @empty {
              @if (!state.loading()) {
                <div
                  class="flex-1 flex items-center justify-center flex-col py-8"
                >
                  <ng-icon
                    name="lucidePackage"
                    class="text-gray-400 mb-4"
                    size="60"
                  ></ng-icon>
                  <p class="text-gray-500 text-lg">
                    Nenhum movimento de estoque encontrado para esta data.
                  </p>
                </div>
              }
            }
          </div>
        } @else if (activeViewMode === 'table') {
          <!-- Visualização em Tabela -->
          <div class="flex-1">
            <fuse-table
              [data]="state.stockMovementList()"
              [loading]="state.loading()"
              [config]="tableConfig()"
            >
            </fuse-table>
          </div>
        }
      </div>
    </div>
  </div>
</div>

<ng-template #typeTemplate let-rowData>
  <p-badge [value]="rowData.typeLabel" [severity]="rowData.typeBadge" />
</ng-template>
