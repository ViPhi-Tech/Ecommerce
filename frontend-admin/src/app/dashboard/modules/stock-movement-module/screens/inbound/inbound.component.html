<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="w-full md: w-[900px]"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ subtitle() }}
      </p>
    </div>
  </ng-template>

  <div class="animate-fade-in">
    <p-tabs value="0">
      <p-tablist>
        <p-tab value="0">Dados de Entrada</p-tab>
        <p-tab value="1">Produtos</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="0">
          <form [formGroup]="inboundData">
            <div class="space-y-4">
              <div class="flex flex-col gap-1">
                <label [for]="'xmlFileInput'" class="label">
                  Arquivo XML
                </label>
                <p-button
                  (onClick)="importXml()"
                  [disabled]="!inboundData.get('nfModel')?.valid"
                  label="Importar dados de arquivo XML"
                  icon="pi pi-upload"
                />
              </div>

              <div>
                <fuse-input
                  [control]="inboundData.get('nfModel')"
                  type="radio"
                  label="Modelo"
                  [items]="nfModel()"
                />
              </div>
            </div>
          </form>
        </p-tabpanel>

        <p-tabpanel value="1">
          <fuse-table
            [data]="inboundData.get('products')?.value"
            [config]="tableConfig()"
          ></fuse-table>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>

  <ng-template #footer></ng-template>
</p-dialog>

<fuse-import-invoice />
