<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="w-full md:w-[900px]"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ subtitle() }}
      </p>
    </div>
  </ng-template>

  <div class="animate-fade-in">
    <form [formGroup]="inboundData">
      <div class="space-y-4">
        <div class="flex flex-col gap-1">
          <label [for]="'xmlFileInput'" class="label"> Arquivo XML </label>
          <p-button
            (onClick)="importXml()"
            [disabled]="!inboundData.get('nfModel')?.valid"
            label="Importar dados de arquivo XML"
            icon="pi pi-upload"
          />
        </div>

        <div>
          <fuse-input
            [control]="inboundData.get('nfModel')"
            type="radio"
            label="Modelo"
            [items]="nfModel()"
          />
        </div>
      </div>
    </form>
    <div class="flex flex-col py-4 gap-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold">Lista de produtos</h3>
      </div>
      <div>
        <fuse-search-product
        />
      </div>
      <fuse-table
        [data]="inboundData.get('products')?.value"
        [config]="tableConfig()"
      ></fuse-table>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        <button
          pButton
          type="submit"
          label="Salvar"
          icon="pi pi-check"
          class="w-[200px]"
          size="small"
          (click)="onSubmit()"
        ></button>

        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDialog($event)"
          severity="secondary"
          class="w-[200px]"
          size="small"
        ></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
