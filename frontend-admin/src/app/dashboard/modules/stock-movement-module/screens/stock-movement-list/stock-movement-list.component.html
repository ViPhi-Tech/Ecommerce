<div class="p-8 animate-fade-in space-y-4">

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <fuse-simple-indicator
      title="Saldo Total"
      value="38"
      variant="info"
      icon="lucidePackage"
    ></fuse-simple-indicator>

    <fuse-simple-indicator
      title="Entradas no Mês"
      value="127"
      variant="success"
      icon="lucideArrowUp"
    ></fuse-simple-indicator>

    <fuse-simple-indicator
      title="Saídas no Mês"
      value="89"
      variant="error"
      icon="lucideArrowDown"
    ></fuse-simple-indicator>
  </div>

  <div class="space-x-4">
    <p-button label="Nova Entrada" (onClick)="newInbound()"></p-button>
    <p-button label="Nova Saída" severity="danger" (onClick)="newOutbound()"></p-button>
  </div>

  <div>
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold">Listagem de Movimentações</h1>
    </div>

    <div class="space-y-4">
      <div>
        <fuse-movement-item />
      </div>
      <div>
        <fuse-movement-item />
      </div>
      <div>
        <fuse-movement-item />
      </div>
    </div>
  </div>
</div>
