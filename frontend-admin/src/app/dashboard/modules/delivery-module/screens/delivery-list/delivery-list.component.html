<div class="p-4 sm:p-6 animate-fade-in">
  <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-0">
    <div class="flex-1 min-w-0">
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-gray-200 truncate">
        Entregas - Listagem
      </h1>
      <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mt-1">
        Gerencie suas entregas e rotas de forma organizada
      </p>
    </div>

    <div class="flex gap-2 sm:gap-3 sm:ml-auto flex-wrap sm:flex-nowrap">
      <p-button
        [text]="true"
        styleClass="h-full"
        (onClick)="refreshDeliveries()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      >
        <ng-icon name="lucideRefreshCw" />
      </p-button>

      <p-button
        icon="pi pi-plus"
        label="Nova Entrega"
        (onClick)="addNewDelivery()"
        pTooltip="Criar nova entrega"
        tooltipPosition="bottom"
        class="flex-1 sm:flex-initial"
      />
    </div>
  </div>

  <div class="animate-left mt-4 sm:mt-6">
    <fuse-table
      [data]="state.deliveryList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    />
  </div>
</div>

<ng-template #status let-row>
  <p-tag
    [value]="getStatusLabel(row.status)"
    [severity]="getStatusSeverity(row.status)"
  ></p-tag>
</ng-template>

<ng-template #orders let-row>
  <span class="font-semibold">{{ row.orders?.length || 0 }}</span>
</ng-template>
