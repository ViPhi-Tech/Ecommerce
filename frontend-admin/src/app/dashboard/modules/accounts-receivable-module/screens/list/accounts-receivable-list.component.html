<div class="p-4 sm:p-6 animate-fade-in">
  <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-0">
    <div class="flex-1 min-w-0">
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-gray-200 truncate">
        Contas a Receber - Listagem
      </h1>
      <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mt-1">
        Gerencie suas contas a receber de forma visual e organizada
      </p>
    </div>

    <div class="flex gap-2 sm:gap-3 sm:ml-auto flex-wrap sm:flex-nowrap">
      <p-button
        icon="pi pi-refresh"
        [text]="true"
        (onClick)="loadAccountsReceivable()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      />

      <p-button
        icon="pi pi-plus"
        label="Nova Conta"
        (onClick)="addNewAccount()"
        pTooltip="Adicionar nova conta a receber"
        tooltipPosition="bottom"
        class="flex-1 sm:flex-initial"
      />
    </div>
  </div>

  <div class="animate-left mt-4 sm:mt-6">
    <fuse-table
      [data]="filteredAccountsReceivable()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    >
      <!-- Filtros personalizados -->
      <div data-headerFilter class="flex gap-4 flex-wrap items-center">
        <!-- Filtro de Cliente -->
        <fuse-client-select
          [(selectedClient)]="selectedClientId"
          [placeholder]="'Filtrar por cliente'"
          [allowAll]="true"
        />

        <!-- Filtro de Período -->
        <fuse-period
          tooltip="Filtrar pedidos recebidos"
          tooltipPosition="bottom"
          [availablePeriods]="[
            'today',
            'last7days',
            'last15days',
            'last30days',
            'currentMonth',
            'all',
          ]"
          [placeholder]="'Filtrar por período'"
          [defaultValue]="'all'"
          [size]="'small'"
          (periodChange)="onPeriodChange($event)"
        />
      </div>
    </fuse-table>
  </div>
</div>
