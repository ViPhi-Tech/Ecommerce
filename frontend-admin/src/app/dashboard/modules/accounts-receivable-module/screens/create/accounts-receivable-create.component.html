<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[600px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col">
      <div class="flex flex-col space-y-1.5 text-center sm:text-left">
        <h2 class="text-2xl font-semibold leading-none tracking-tight">
          {{ title() }}
        </h2>
        <p class="text-sm text-muted-foreground">
          Preencha os dados da nova conta a receber abaixo
        </p>
      </div>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4 scroll-form">
    <div>
      <form [formGroup]="accountsReceivableForm" class="row">
        <div class="col-12">
          <fuse-select
            label="Cliente"
            [items]="clientState.clientList()"
            valueRef="id"
            labelRef="fullName"
            [isLoading]="isLoading()"
            [drawerAux]="['clients', 'new']"
            [control]="accountsReceivableForm.get('clientId')"
            placeholder="Adicione um cliente"
          />
        </div>
        <div class="col-12 md:col-6 mt-4">
          <fuse-datepicker
            label="Data de Emissão"
            [isLoading]="isLoading()"
            placeholder="00/00/0000"
            [control]="accountsReceivableForm.get('issueDate')"
            type="date"
          />
        </div>
        <div class="col-12 md:col-6 mt-4">
          <fuse-datepicker
            label="Data de Vencimento"
            [isLoading]="isLoading()"
            placeholder="00/00/0000"
            [control]="accountsReceivableForm.get('dueDate')"
            type="date"
          />
        </div>
        <div class="col-12 md:col-12 mt-4">
          <fuse-input
            [isLoading]="isLoading()"
            label="Valor"
            [control]="accountsReceivableForm.get('amount')"
            type="money"
            placeholder="Ex: 100,00"
          />
        </div>
        <div class="col-12 md:col-12 mt-4">
          <div class="flex items-center">
            <p-checkbox
              inputId="recurringIncome"
              name="recurringIncome"
              [value]="true"
              [binary]="true"
              formControlName="recurringIncome"
            />
            <label for="recurringIncome" class="ml-2">
              Receita recorrente (Mensalmente no dia do vencimento)
            </label>
          </div>
        </div>
        <div class="col-12 md:col-12 mt-4">
          <fuse-input
            [isLoading]="isLoading()"
            type="textarea"
            label="Descrição"
            [control]="accountsReceivableForm.get('description')"
            placeholder="Ex: Venda de produto X"
          />
        </div>
      </form>
    </div>

    @if (dateErrors.length > 0) {
      <div class="mt-4 p-4 bg-red-50 border border-red-200 rounded-md">
        <h4 class="text-red-800 font-semibold">Erros de validação:</h4>
        <ul class="list-disc list-inside text-red-700 mt-2">
          @for (error of dateErrors; track $index) {
            <li>{{ error }}</li>
          }
        </ul>
      </div>
    }
  </div>

  <ng-template #footer>
    <div
      class="w-full flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 sm:gap-4"
    >
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        (click)="closeDialog()"
        outlined="true"
        severity="secondary"
        class="w-full sm:w-[200px] order-2 sm:order-1"
        size="small"
      ></button>
      @if (!isView()) {
        <button
          pButton
          type="submit"
          [label]="submitButtonLabel()"
          icon="pi pi-check"
          class="w-full sm:w-[200px] order-1 sm:order-2"
          size="small"
          [disabled]="accountsReceivableForm.invalid"
          (click)="onSubmit($event)"
        ></button>
      }
    </div>
  </ng-template>
</p-dialog>
