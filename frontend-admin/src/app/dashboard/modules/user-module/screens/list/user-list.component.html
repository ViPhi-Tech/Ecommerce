<div class="p-8 animate-fade-in">
  <div class="mb-4">
    <h1 class="text-xl font-bold">Lista de Usuários</h1>
    <fuse-table
      [data]="state.userList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    >
      <ng-container data-headerFilter>
        <fuse-table-filter>
          <div class="space-y-4">
            <!-- Filtros podem ser adicionados aqui -->
          </div>
        </fuse-table-filter>
      </ng-container>
    </fuse-table>
  </div>
</div>
