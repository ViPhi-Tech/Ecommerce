<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[600px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados do usuário abaixo
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      @if (userForm) {
        <form [formGroup]="userForm" class="row">
          <div class="col-12 mb-4">
            <fuse-input
              [isLoading]="isLoading()"
              label="Nome completo"
              [control]="userForm.get('fullName')"
              placeholder="Digite o nome completo do usuário"
            />
          </div>

          <div class="col-12 mb-4">
            <fuse-input
              [isLoading]="isLoading()"
              type="email"
              label="Email"
              [control]="userForm.get('email')"
              placeholder="Digite o email do usuário"
            />
          </div>

          <div class="col-12 mb-4">
            <fuse-input
              [isLoading]="isLoading()"
              type="password"
              label="Senha"
              [control]="userForm.get('password')"
              placeholder="Digite a senha do usuário"
            />
          </div>

          <div class="col-12 mb-4">
            <fuse-radio
              [isLoading]="isLoading()"
              label="Status do Usuário"
              [control]="userForm.get('isActive')"
              [items]="[
                { value: true, label: 'Ativo' },
                { value: false, label: 'Inativo' },
              ]"
              valueRef="value"
              labelRef="label"
              direction="row"
              groupName="userStatus"
            />
          </div>

          <div class="col-12 mb-4">
            <div class="flex justify-between items-center mb-3">
              <div class="block text-sm font-medium">
                Módulos do Sistema *
              </div>
              <div class="flex gap-2">
                <button
                  type="button"
                  class="text-xs text-blue-600 hover:text-blue-800 underline"
                  (click)="selectAllModules()"
                  [disabled]="isLoading() || areAllModulesSelected()"
                >
                  Selecionar Todos
                </button>
                <button
                  type="button"
                  class="text-xs text-gray-600 hover:text-gray-800 underline"
                  (click)="clearAllModules()"
                  [disabled]="isLoading() || areNoModulesSelected()"
                >
                  Limpar Todos
                </button>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 modules-grid">
              @for (module of systemModules; track module.id) {
                <div class="flex items-start space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors module-card"
                     [class.selected]="isModuleSelected(module.id)">
                  <input
                    type="checkbox"
                    [id]="'module-' + module.id"
                    [checked]="isModuleSelected(module.id)"
                    (change)="toggleModule(module.id)"
                    class="mt-1 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                    [disabled]="isLoading()"
                  />
                  <div class="flex-1 min-w-0">
                    <label [for]="'module-' + module.id" class="block text-sm cursor-pointer module-title">
                      {{ module.name }}
                    </label>
                    <p class="mt-1 module-description">
                      {{ module.description }}
                    </p>
                  </div>
                </div>
              }
            </div>
            @if (userForm.get('modules')?.invalid && userForm.get('modules')?.touched) {
              <div class="validation-error">
                Selecione pelo menos um módulo para o usuário
              </div>
            }
          </div>
        </form>
      }
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        <button
          pButton
          type="submit"
          [label]="submitButtonLabel()"
          icon="pi pi-check"
          class="w-[200px]"
          size="small"
          [loading]="isLoading()"
          (click)="onSubmit($event)"
        ></button>

        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDialog($event)"
          [outlined]="true"
          severity="secondary"
          class="w-[200px]"
          size="small"
        ></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
