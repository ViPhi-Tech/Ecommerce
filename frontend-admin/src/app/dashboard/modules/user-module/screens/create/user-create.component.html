@if (userForm) {
  <form [formGroup]="userForm" class="flex flex-col gap-4">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-12">
        <fuse-input
          [isLoading]="isLoading()"
          label="Nome completo"
          [control]="userForm.get('fullName')"
          placeholder="Digite o nome completo do usuário"
        />
      </div>

      <div class="col-12">
        <fuse-input
          [isLoading]="isLoading()"
          type="email"
          label="Email"
          [control]="userForm.get('email')"
          placeholder="Digite o email do usuário"
        />
      </div>

      <div class="col-12">
        <fuse-input
          [isLoading]="isLoading()"
          type="password"
          label="Senha"
          [control]="userForm.get('password')"
          placeholder="Digite a senha do usuário"
        />
      </div>

      <div class="col-12">
        <fuse-input
          [isLoading]="isLoading()"
          type="radio"
          label="Status"
          [control]="userForm.get('isActive')"
          [items]="[
            { key: 'active', label: 'Ativo', value: true },
            { key: 'inactive', label: 'Inativo', value: false },
          ]"
        />
      </div>
    </div>
  </form>

  <div class="w-full justify-end flex items-center gap-4 mt-4">
    <div class="flex gap-2">
      <button
        pButton
        type="submit"
        [label]="submitButtonLabel()"
        icon="pi pi-check"
        class="w-[200px]"
        size="small"
        [loading]="isLoading()"
        (click)="onSubmit($event)"
      ></button>

      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        (click)="closeDrawer()"
        severity="secondary"
        class="w-[200px]"
        size="small"
      ></button>
    </div>
  </div>
}
