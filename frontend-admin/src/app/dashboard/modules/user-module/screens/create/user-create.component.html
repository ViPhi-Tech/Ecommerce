<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[800px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados do usuário abaixo
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      @if (userForm) {
        <form [formGroup]="userForm" class="row">
          <div class="col-12 mb-4">
            <fuse-input
              [isLoading]="isLoading()"
              label="Nome completo"
              [control]="userForm.get('fullName')"
              placeholder="Digite o nome completo do usuário"
            />
          </div>

          <div class="col-12 mb-4">
            <fuse-input
              [isLoading]="isLoading()"
              label="Email"
              [control]="userForm.get('email')"
              placeholder="Digite o email do usuário"
            />
          </div>

          <div class="col-12 mb-4">
            <fuse-input
              [isLoading]="isLoading()"
              type="password"
              label="Senha"
              [control]="userForm.get('password')"
              placeholder="Digite a senha do usuário"
            />
          </div>

          <div class="col-12 mb-4">
            <div class="flex justify-between items-center mb-3">
              <div class="block text-sm font-medium">Módulos do Sistema *</div>
              <div class="flex gap-2">
                <button
                  type="button"
                  class="text-xs text-blue-600 hover:text-blue-800 underline"
                  (click)="selectAllModules()"
                  [disabled]="isLoading() || areAllModulesSelected()"
                >
                  Selecionar Todos
                </button>
                <button
                  type="button"
                  class="text-xs text-gray-600 hover:text-gray-800 underline"
                  (click)="clearAllModules()"
                  [disabled]="isLoading() || areNoModulesSelected()"
                >
                  Limpar Todos
                </button>
              </div>
            </div>
            <div
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 modules-grid"
            >
              @for (module of systemModules; track module.id) {
                <div
                  class="flex items-start space-x-3 p-3 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors module-card cursor-pointer"
                  [class.selected]="isModuleSelected(module.id)"
                  [class.disabled]="isLoading()"
                  (click)="toggleModule(module.id)"
                  (keyup.enter)="toggleModule(module.id)"
                  (keyup.space)="toggleModule(module.id)"
                  [attr.tabindex]="isLoading() ? -1 : 0"
                  [attr.role]="'checkbox'"
                  [attr.aria-checked]="isModuleSelected(module.id)"
                  [attr.aria-label]="'Selecionar módulo ' + module.name"
                >
                  <input
                    type="checkbox"
                    [id]="'module-' + module.id"
                    [checked]="isModuleSelected(module.id)"
                    (change)="toggleModule(module.id)"
                    class="mt-1 h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                    [disabled]="isLoading()"
                    tabindex="-1"
                  />
                  <div class="flex-1 min-w-0">
                    <label
                      [for]="'module-' + module.id"
                      class="block text-sm cursor-pointer module-title"
                    >
                      {{ module.name }}
                    </label>
                    <p class="mt-1 module-description">
                      {{ module.description }}
                    </p>
                  </div>
                </div>
              }
            </div>
            @if (
              userForm.get('modules')?.invalid &&
              userForm.get('modules')?.touched
            ) {
              <div class="validation-error">
                Selecione pelo menos um módulo para o usuário
              </div>
            }
          </div>
        </form>
      }
    </div>
  </div>

  <ng-template #footer>
    <div
      class="w-full flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 sm:gap-4"
    >
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        (click)="closeDialog($event)"
        [outlined]="true"
        severity="secondary"
        class="w-full sm:w-[200px] order-2 sm:order-1"
        size="small"
      ></button>
      <button
        pButton
        type="submit"
        [label]="submitButtonLabel()"
        icon="pi pi-check"
        class="w-full sm:w-[200px] order-1 sm:order-2"
        size="small"
        [loading]="isLoading()"
        (click)="onSubmit($event)"
      ></button>
    </div>
  </ng-template>
</p-dialog>
