<div class="flex flex-col gap-4 mt-3 scroll-form">
  <div>
    <form [formGroup]="accountsPayableForm" class="row">
      <div class="col-12">
        <fuse-input
          label="Fornecedor"
          [isLoading]="isLoading()"
          [control]="accountsPayableForm.get('provider')"
          placeholder="Ex: Fornecedor X"
        />
      </div>
      <div class="col-12 md:col-6 mt-4">
        <fuse-datepicker
          label="Data de vencimento (Original)"
          [isLoading]="isLoading()"
          placeholder="00/00/0000"
          [control]="accountsPayableForm.get('dueDateOriginal')"
          type="date"
        />
      </div>
      <div class="col-12 md:col-6 mt-4">
        <fuse-datepicker
          label="Data de Emissão"
          [isLoading]="isLoading()"
          placeholder="00/00/0000"
          [control]="accountsPayableForm.get('issueDate')"
          type="date"
        />
      </div>
      <div class="col-12 md:col-6 mt-4">
        <fuse-datepicker
          label="Data de Vencimento"
          [isLoading]="isLoading()"
          placeholder="00/00/0000"
          [control]="accountsPayableForm.get('dueDate')"
          type="date"
        />
      </div>
      <div class="col-12 md:col-6 mt-4">
        <fuse-datepicker
          label="Data de competência"
          [isLoading]="isLoading()"
          placeholder="00/00/0000"
          [control]="accountsPayableForm.get('competenceDate')"
          type="date"
        />
      </div>
      <div class="col-12 md:col-12 mt-4">
        <fuse-input
          [isLoading]="isLoading()"
          label="Valor"
          [control]="accountsPayableForm.get('amount')"
          type="number"
          placeholder="Ex: 100.00"
        />
      </div>
      <div class="col-12 md:col-12 mt-4">
        <div class="flex items-center">
          <p-checkbox
            inputId="recurringPurchase"
            name="recurringPurchase"
            [value]="true"
            formControlName="recurringPurchase"
          />
          <label for="recurringPurchase" class="ml-2">
            Compra recorrente (Mensalmente no dia do vencimento)
          </label>
        </div>
      </div>
      <div class="col-12 md:col-12 mt-4">
        <fuse-input
          [isLoading]="isLoading()"
          type="textarea"
          label="Descrição"
          [control]="accountsPayableForm.get('description')"
          placeholder="Ex: Conta de energia"
        />
      </div>
    </form>
  </div>
</div>
