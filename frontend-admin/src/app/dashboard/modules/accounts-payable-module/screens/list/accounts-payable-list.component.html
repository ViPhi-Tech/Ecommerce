<div class="p-4 sm:p-6 animate-fade-in">
  <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-0">
    <div class="flex-1 min-w-0">
      <h1 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-gray-200 truncate">
        Contas a Pagar - Listagem
      </h1>
      <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mt-1">
        Gerencie suas contas a pagar de forma visual e organizada
      </p>
    </div>

    <div class="flex gap-2 sm:gap-3 sm:ml-auto flex-wrap sm:flex-nowrap">
      <!-- <p-button
        icon="pi pi-table"
        label="Kanban"
        [text]="true"
        (onClick)="navigateToKanban()"
        pTooltip="Visualizar em Kanban"
        tooltipPosition="bottom"
      /> -->

      <p-button
        icon="pi pi-refresh"
        [text]="true"
        (onClick)="loadAccountsPayable()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      />

      <p-button
        icon="pi pi-plus"
        label="Nova Conta"
        (onClick)="addNewAccount()"
        pTooltip="Adicionar nova conta a pagar"
        tooltipPosition="bottom"
        class="flex-1 sm:flex-initial"
      />
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4 sm:mt-6">
    <fuse-simple-indicator
      title="Total a pagar"
      [value]="(state.totalPayable() | currency: 'BRL') ?? 'R$ 0,00'"
      variant="warning"
      icon="lucideBanknote"
      [loading]="state.loading()"
    />
    <fuse-simple-indicator
      title="Total pago"
      [value]="(state.totalPaid() | currency: 'BRL') ?? 'R$ 0,00'"
      variant="success"
      icon="lucideCircleCheckBig"
      [loading]="state.loading()"
    />
    <fuse-simple-indicator
      title="Vencidas"
      [value]="state.overdueCount()"
      variant="error"
      icon="lucideCalendarX"
      [loading]="state.loading()"
    />
  </div>

  <div class="animate-left mt-4 sm:mt-6">
    <fuse-table
      [data]="state.accountsPayableList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    >
    </fuse-table>
  </div>
</div>
