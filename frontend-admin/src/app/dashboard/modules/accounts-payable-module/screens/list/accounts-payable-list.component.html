<div class="p-6 animate-fade-in">
  <div class="flex items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">
        Contas a Pagar - Listagem
      </h1>
      <p class="text-gray-600 dark:text-gray-400 mt-1">
        Gerencie suas contas a pagar de forma visual e organizada
      </p>
    </div>

    <div class="flex gap-3 ml-auto">
      <!-- <p-button
        icon="pi pi-table"
        label="Kanban"
        [text]="true"
        (onClick)="navigateToKanban()"
        pTooltip="Visualizar em Kanban"
        tooltipPosition="bottom"
      /> -->

      <p-button
        icon="pi pi-refresh"
        [text]="true"
        (onClick)="loadAccountsPayable()"
        pTooltip="Atualizar dados"
        tooltipPosition="bottom"
      />

      <p-button
        icon="pi pi-plus"
        label="Nova Conta"
        (onClick)="addNewAccount()"
        pTooltip="Adicionar nova conta a pagar"
        tooltipPosition="bottom"
      />
    </div>
  </div>

  <div class="animate-left">
    <fuse-table
      [data]="state.accountsPayableList()"
      [loading]="state.loading()"
      [config]="tableConfig()"
    >
    </fuse-table>
  </div>
</div>
