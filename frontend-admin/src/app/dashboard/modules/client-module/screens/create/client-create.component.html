<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-ww-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados do cliente abaixo
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      <form [formGroup]="clientForm" class="row">
        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="Nome Completo"
            [control]="clientForm.get('fullName')"
            placeholder="Ex: João Silva"
          />
        </div>

        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="Email"
            [control]="clientForm.get('email')"
            type="text"
            placeholder="Ex: joao@email.com"
          />
        </div>

        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            type="text"
            [label]="documentLabel()"
            [control]="clientForm.get('document')"
            [placeholder]="documentPlaceholder()"
            (inputChange)="handleDocumentInput($event)"
            (blurChange)="handleDocumentBlur($event)"
            mask="CPF_CNPJ"
          />
        </div>

        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            type="text"
            label="Telefone"
            [control]="clientForm.get('phone')"
            placeholder="(00) 00000-0000"
            mask="(99) 99999-9999"
          />
        </div>
      </form>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        <button
          pButton
          type="submit"
          label="Salvar"
          icon="pi pi-check"
          class="w-[200px]"
          size="small"
          (click)="onSubmit()"
        ></button>

        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDialog($event)"
          severity="secondary"
          [outlined]="true"
          class="w-[200px]"
          size="small"
        ></button>
      </div>
    </div>
  </ng-template>
</p-dialog>
