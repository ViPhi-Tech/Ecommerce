<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[800px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados do fornecedor abaixo
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      <form [formGroup]="supplierForm" class="row">
        <!-- Dados básicos -->
        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="Razão Social"
            [control]="supplierForm.get('legalName')"
            placeholder="Ex: Fornecedora ABC Ltda"
          />
        </div>

        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="Nome Fantasia"
            [control]="supplierForm.get('tradeName')"
            placeholder="Ex: ABC Distribuidora"
          />
        </div>

        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="CNPJ"
            [control]="supplierForm.get('cnpj')"
            placeholder="00.000.000/0000-00"
            mask="00.000.000/0000-00"
          />
        </div>

        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="Endereço"
            [control]="supplierForm.get('address')"
            placeholder="Rua, número, bairro, cidade - Estado, CEP"
          />
        </div>

        <!-- Contato -->
        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="Email"
            [control]="supplierForm.get('email')"
            placeholder="contato@fornecedor.com.br"
          />
        </div>

        <div class="col-12 md:col-6 mb-4">
          <fuse-input
            label="Telefone"
            [control]="supplierForm.get('phone')"
            placeholder="(11) 99999-9999"
            mask="(99) 99999-9999"
          />
        </div>
      </form>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 sm:gap-4">
      <button
        pButton
        type="button"
        label="Cancelar"
        [disabled]="isLoading()"
        icon="pi pi-times"
        (click)="closeDialog($event)"
        severity="secondary"
        [outlined]="true"
        class="w-full sm:w-[200px] order-2 sm:order-1"
        size="small"
      ></button>
      <button
        pButton
        type="submit"
        label="Salvar"
        icon="pi pi-check"
        class="w-full sm:w-[200px] order-1 sm:order-2"
        size="small"
        [loading]="isLoading()"
        (click)="onSubmit()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
