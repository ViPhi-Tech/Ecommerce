<p-drawer
  #drawerRef
  [header]="title()"
  [visible]="visible()"
  (onHide)="onCloseDrawer()"
  position="right"
  styleClass="!w-full md:!w-[80vw] lg:!w-[80vw]"
  transitionOptions="300ms cubic-bezier(0, 0, 0.2, 1)"
>
  @if (invoiceForm) {
    <form [formGroup]="invoiceForm" class="flex flex-col gap-4">
      <div class="container mx-auto">
        <form class="space-y-8">
          <div
            class="rounded-lg border dark:border-[#52525b] bg-card text-card-foreground shadow-sm"
          >
            <div class="p-6 pt-6">
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-input
                    label="Número da NF"
                    placeholder="000000000"
                    [control]="invoiceForm.get('numeroNF')"
                  />
                </div>
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-input
                    label="Série"
                    placeholder="001"
                    [control]="invoiceForm.get('serie')"
                  />
                </div>
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-datepicker
                    label="Data de emissão"
                    [control]="invoiceForm.get('dataEmissao')"
                  />
                </div>
              </div>
            </div>
          </div>

          <div
            class="rounded-lg border dark:border-[#52525b] bg-card text-card-foreground shadow-sm"
            formGroupName="emitente"
          >
            <div class="p-6 pt-6">
              <h2 class="text-xl font-semibold mb-4">Dados do Emitente</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-input
                    label="CNPJ"
                    placeholder="00.000.000/0000-00"
                    [control]="invoiceForm.get('emitente')?.get('cnpj')"
                  />
                </div>
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-input
                    label="Nome/Razão Social"
                    placeholder="Nome da empresa emitente"
                    [control]="invoiceForm.get('emitente')?.get('nome')"
                  />
                </div>
              </div>
            </div>
          </div>

          <div
            class="rounded-lg border dark:border-[#52525b] bg-card text-card-foreground shadow-sm"
            formGroupName="destinatario"
          >
            <div class="p-6 pt-6">
              <h2 class="text-xl font-semibold mb-4">Dados do Destinatário</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-input
                    label="CNPJ"
                    placeholder="00.000.000/0000-00"
                    [control]="invoiceForm.get('destinatario')?.get('cnpj')"
                  />
                </div>
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-input
                    label="Nome/Razão Social"
                    placeholder="Nome da empresa destinatária"
                    [control]="invoiceForm.get('destinatario')?.get('nome')"
                  />
                </div>
              </div>
            </div>
          </div>

          <div
            class="rounded-lg border dark:border-[#52525b] bg-card text-card-foreground shadow-sm"
          >
            <div class="p-6 pt-6">
              <h2 class="text-xl font-semibold mb-4">Valores da Nota</h2>
              <div
                class="grid grid-cols-1 md:grid-cols-3 gap-6"
                formGroupName="valores"
              >
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-input
                    label="Valor Total (R$)"
                    placeholder="0,00"
                    [control]="invoiceForm.get('valores')?.get('valorTotal')"
                    type="number"
                    step="0.01"
                  />
                </div>
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-select
                    label="Forma de Pagamento"
                    placeholder="Forma de pagamento"
                    [control]="
                      invoiceForm.get('valores')?.get('formaPagamento')
                    "
                    [items]="paymentMethods()"
                  />
                </div>
                <div class="space-y-2 flex flex-col gap-2">
                  <fuse-select
                    label="Natureza da Operação"
                    placeholder="Natureza da Operação"
                    [control]="
                      invoiceForm.get('valores')?.get('naturezaOperacao')
                    "
                    [items]="paymentMethods()"
                  />
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </form>
  }

  <ng-template #footer>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="submit"
        label="Cadastrar"
        icon="pi pi-check"
        class="w-full"
        severity="success"
      ></button>

      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        class="w-full"
        (click)="closeDrawer($event)"
        severity="danger"
      ></button>
    </div>
  </ng-template>
</p-drawer>
