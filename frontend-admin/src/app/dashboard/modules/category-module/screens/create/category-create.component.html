<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[600px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados da nova categoria abaixo
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      <form [formGroup]="categoryForm" class="row">
        <div class="col-12 md:col-12 mb-6">
          <fuse-input
            label="Nome da Categoria"
            [control]="categoryForm.get('name')"
            placeholder="Ex: Eletrônicos"
          />
        </div>
      </form>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 sm:gap-4">
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        (click)="closeDialog($event)"
        severity="secondary"
        [outlined]="true"
        class="w-full sm:w-[200px] order-2 sm:order-1"
        size="small"
      ></button>
      <button
        pButton
        type="submit"
        label="Salvar"
        icon="pi pi-check"
        class="w-full sm:w-[200px] order-1 sm:order-2"
        size="small"
        (click)="onSubmit()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
