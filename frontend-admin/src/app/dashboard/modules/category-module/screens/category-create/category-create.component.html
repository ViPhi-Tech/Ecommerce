<p-dialog
  #dialogRef
  [(visible)]="visible"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [closeOnEscape]="true"
  [draggable]="false"
  styleClass="max-w-[600px] w-full"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados da nova categoria abaixo
      </p>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4">
    <div>
      <form [formGroup]="categoryForm" class="row">
        <div class="col-12 md:col-12 mb-6">
          <fuse-input
            label="Nome da Categoria"
            [control]="categoryForm.get('name')"
            placeholder="Ex: Eletrônicos"
          />
        </div>
      </form>
    </div>
  </div>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        
        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDialog($event)"
          severity="secondary"
          class="w-[200px]"
          size="small"
        ></button>

        <button
          pButton
          type="submit"
          label="Salvar"
          icon="pi pi-check"
          class="w-[200px]"
          size="small"
          (click)="onSubmit($event)"
        ></button>
        
      </div>
    </div>
  </ng-template>
</p-dialog>
