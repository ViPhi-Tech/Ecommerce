<header class="h-16 border-b border-gray-200 dark:border-dark">
  <nav
    class="px-3 sm:px-6 flex items-center justify-between bg-white dark:bg-container-background border-b border-gray-200 dark:border-dark h-full"
  >
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <!-- Botão de menu para mobile -->
      <button
        (click)="toggleSidebar()"
        type="button"
        class="lg:hidden p-2 rounded-md hover:bg-muted dark:hover:bg-muted-dark transition-colors flex-shrink-0"
        aria-label="Abrir menu"
      >
        <ng-icon
          name="lucideMenu"
          class="text-xl text-gray-600 dark:text-gray-300"
        />
      </button>
      
      <div
        class="font-medium text-sm flex flex-col items-start space-x-1 sm:space-x-0 truncate max-w-[300px] sm:max-w-[300px] min-w-0"
      >
        @if (pageTitle().title) {
          <span class="font-semibold leading-none tracking-tight text-base sm:text-xl truncate w-full">
            {{ pageTitle().title }}
          </span>
        }
        @if (pageTitle().subTitle) {
          <span
            class="text-xs text-gray-500 font-light dark:text-muted-foreground truncate w-full hidden sm:block"
          >
            {{ pageTitle().subTitle }}
          </span>
        }
      </div>
    </div>
    <div class="flex items-center gap-2 sm:gap-4 ml-auto sm:ml-0 flex-shrink-0">
      <fuse-quick-access />

      <button type="button" class="header-button">
        <ng-icon
          name="lucideBell"
          class="text-xl text-gray-600 dark:text-gray-300 transition-all"
        />
      </button>
      <button (click)="themePopover.toggle($event)" type="button" class="header-button" aria-label="Aparência">
        <ng-icon name="lucidePalette" class="text-xl text-gray-600 dark:text-gray-300 transition-all" />
      </button>

      <p-popover #themePopover>
        <div class="p-3 flex flex-col gap-4 w-56">

          <!-- Modo claro / escuro -->
          <div>
            <p class="text-xs font-semibold text-[var(--p-text-muted-color)] uppercase tracking-wide mb-2">Modo</p>
            <div class="flex gap-2">
              <button
                class="theme-mode-btn flex-1"
                [class.theme-mode-btn--active]="!themeService.darkMode()"
                (click)="themeService.toggleDarkMode()"
                [disabled]="!themeService.darkMode()"
              >
                <ng-icon name="lucideSun" size="14" />
                <span>Claro</span>
              </button>
              <button
                class="theme-mode-btn flex-1"
                [class.theme-mode-btn--active]="themeService.darkMode()"
                (click)="themeService.toggleDarkMode()"
                [disabled]="themeService.darkMode()"
              >
                <ng-icon name="lucideMoon" size="14" />
                <span>Escuro</span>
              </button>
            </div>
          </div>

          <!-- Cores -->
          <div>
            <p class="text-xs font-semibold text-[var(--p-text-muted-color)] uppercase tracking-wide mb-2">Cor principal</p>
            <div class="flex flex-wrap gap-2">
              @for (color of themeColors; track color.name) {
                <button
                  class="theme-color-swatch"
                  [style.background-color]="color.shade500"
                  [title]="color.label"
                  [class.theme-color-swatch--active]="themeService.primaryColor() === color.name"
                  (click)="themeService.setPrimaryColor(color.name)"
                >
                  @if (themeService.primaryColor() === color.name) {
                    <ng-icon name="lucideCheck" size="12" class="text-white" />
                  }
                </button>
              }
            </div>
          </div>

        </div>
      </p-popover>
      <button
        (click)="profilePopover.toggle($event)"
        type="button"
        class="focus:outline-none"
        aria-label="Abrir menu de perfil"
      >
        <fuse-avatar
          [label]="'Admin'"
          icon="lucideUser"
          size="normal"
          shape="circle"
        />
      </button>

      <p-popover #profilePopover styleClass="popover-actions">
        <div
          role="menu"
          class="z-50 w-[8rem] px-2 overflow-hidden rounded-md border dark:border-dark bg-popover p-1 text-popover-foreground shadow-md data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2 w-[200px]"
        >
          <!-- <button
            (click)="settingsModal.open(); profilePopover.hide()"
            class="relative cursor-pointer flex w-full select-none items-center gap-2 rounded-sm px-2 py-1.5 outline-none transition-colors hover:bg-accent focus:bg-accent focus:text-accent-foreground"
          >
            <ng-icon name="lucideSettings" size="18" />
            <span class="ml-2 text-sm">Configurações</span>
          </button> -->
          <button
            (click)="logout()"
            class="relative cursor-pointer flex w-full select-none items-center gap-2 rounded-sm px-2 py-1.5 outline-none transition-colors hover:bg-accent focus:bg-accent focus:text-accent-foreground"
          >
            <ng-icon name="lucideLogOut" color="red" size="18"></ng-icon>
            <span class="ml-2 text-sm text-red-600">Sair</span>
          </button>
        </div>
      </p-popover>

      <fuse-settings-modal />
    </div>
  </nav>
</header>
