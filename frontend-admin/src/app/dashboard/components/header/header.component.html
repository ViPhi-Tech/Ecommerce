<header class="h-16 border-b border-gray-200 dark:border-[#1F1F23]">
  <nav
    class="px-3 sm:px-6 flex items-center justify-between bg-white dark:bg-container-background border-b border-gray-200 dark:border-[#1F1F23] h-full"
  >
    <div
      class="font-medium text-sm hidden sm:flex sm:flex-col items-center sm:items-start space-x-1 sm:space-x-0 truncate max-w-[300px]"
    >
      @if (pageTitle().title) {
        <span class="text-gray-600 dark:text-gray-300 text-xl">
          {{ pageTitle().title }}
        </span>
      }
      @if (pageTitle().subTitle) {
        <span class="text-xs text-gray-500 font-light dark:text-muted-foreground">
          {{ pageTitle().subTitle }}
        </span>
      }
    </div>
    <div class="flex items-center gap-2 sm:gap-4 ml-auto sm:ml-0">
      <fuse-quick-access />

      <button type="button" class="header-button">
        <ng-icon
          name="lucideBell"
          class="text-xl text-gray-600 dark:text-gray-300 transition-all"
        />
      </button>
      <button (click)="toggleDarkMode()" class="header-button">
        <div class="flex dark:hidden">
          <ng-icon
            name="lucideSun"
            class="text-xl text-gray-600 dark:text-gray-300 transition-all"
          />
        </div>
        <div class="hidden dark:flex">
          <ng-icon
            name="lucideMoon"
            class="text-xl text-gray-600 dark:text-gray-300 transition-all"
          />
        </div>

        <span class="sr-only">Toggle theme</span>
      </button>
      <button type="button" class="focus:outline-none">
        <img
          alt="User avatar"
          loading="lazy"
          width="28"
          height="28"
          decoding="async"
          data-nimg="1"
          class="rounded-full ring-2 ring-gray-200 dark:ring-[#2B2B30] sm:w-8 sm:h-8 cursor-pointer"
          src="https://ferf1mheo22r9ira.public.blob.vercel-storage.com/avatar-01-n0x8HFv8EUetf9z6ht0wScJKoTHqf8.png"
          style="color: transparent"
        />
      </button>
    </div>
  </nav>
</header>
