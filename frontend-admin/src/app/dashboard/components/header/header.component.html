<header class="h-16 border-b border-gray-200 dark:border-dark">
  <nav
    class="px-3 sm:px-6 flex items-center justify-between bg-white dark:bg-container-background border-b border-gray-200 dark:border-dark h-full"
  >
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <!-- Botão de menu para mobile -->
      <button
        (click)="toggleSidebar()"
        type="button"
        class="lg:hidden p-2 rounded-md hover:bg-muted dark:hover:bg-muted-dark transition-colors flex-shrink-0"
        aria-label="Abrir menu"
      >
        <ng-icon
          name="lucideMenu"
          class="text-xl text-gray-600 dark:text-gray-300"
        />
      </button>
      
      <div
        class="font-medium text-sm flex flex-col items-start space-x-1 sm:space-x-0 truncate max-w-[300px] sm:max-w-[300px] min-w-0"
      >
        @if (pageTitle().title) {
          <span class="font-semibold leading-none tracking-tight text-base sm:text-xl truncate w-full">
            {{ pageTitle().title }}
          </span>
        }
        @if (pageTitle().subTitle) {
          <span
            class="text-xs text-gray-500 font-light dark:text-muted-foreground truncate w-full hidden sm:block"
          >
            {{ pageTitle().subTitle }}
          </span>
        }
      </div>
    </div>
    <div class="flex items-center gap-2 sm:gap-4 ml-auto sm:ml-0 flex-shrink-0">
      <fuse-quick-access />

      <button type="button" class="header-button">
        <ng-icon
          name="lucideBell"
          class="text-xl text-gray-600 dark:text-gray-300 transition-all"
        />
      </button>
      <button (click)="toggleDarkMode()" class="header-button">
        <div class="flex dark:hidden">
          <ng-icon
            name="lucideSun"
            class="text-xl text-gray-600 dark:text-gray-300 transition-all"
          />
        </div>
        <div class="hidden dark:flex">
          <ng-icon
            name="lucideMoon"
            class="text-xl text-gray-600 dark:text-gray-300 transition-all"
          />
        </div>

        <span class="sr-only">Toggle theme</span>
      </button>
      <button
        (click)="profilePopover.toggle($event)"
        type="button"
        class="focus:outline-none"
      >
        <img
          alt="User avatar"
          loading="lazy"
          width="28"
          height="28"
          decoding="async"
          data-nimg="1"
          class="rounded-full ring-2 ring-gray-200 dark:ring-[#2B2B30] sm:w-8 sm:h-8 cursor-pointer"
          src="https://ferf1mheo22r9ira.public.blob.vercel-storage.com/avatar-01-n0x8HFv8EUetf9z6ht0wScJKoTHqf8.png"
          style="color: transparent"
        />
      </button>

      <p-popover #profilePopover styleClass="popover-actions">
        <div
          role="menu"
          class="z-50 w-[8rem] px-2 overflow-hidden rounded-md border dark:border-dark bg-popover p-1 text-popover-foreground shadow-md data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0 data-[state=closed]:zoom-out-95 data-[state=open]:zoom-in-95 data-[side=bottom]:slide-in-from-top-2 data-[side=left]:slide-in-from-right-2 data-[side=right]:slide-in-from-left-2 data-[side=top]:slide-in-from-bottom-2 w-[200px]"
        >
          <button
            (click)="logout()"
            class="relative cursor-pointer flex w-full select-none items-center gap-2 rounded-sm px-2 py-1.5 outline-none transition-colors focus:bg-accent focus:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50"
          >
            <ng-icon name="lucideLogOut" color="red" size="18"></ng-icon>
            <span class="ml-2 text-sm text-red-600">Sair</span>
          </button>
        </div>
      </p-popover>
    </div>
  </nav>
</header>
