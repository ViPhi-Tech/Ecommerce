<a
  (onmouseenter)="onMouseEnter()"
  (onmouseleave)="onMouseLeave()"
  (click)="toggleMenu(!item().visible); onItemClick()"
  routerLinkActive="menu-item-active"
  [routerLinkActiveOptions]="{ exact: item().exact ?? false }"
  [routerLink]="item().route"
  class="menu-item {{ addictionalClass() }}"
>
  <ng-icon size="16" [name]="item().icon" class="mr-3" />
  <span class="menu-item-label animate-fadein">{{ item().label }}</span>

  @if (item().items?.length) {
    <ng-icon
      size="16"
      class="ml-auto menu-item-arrow"
      name="matArrowDropDownOutline"
    />
  }
</a>
@if (item().items?.length) {
  <div [@heightAnimation]="item().visible ? 'in' : 'out'">
    @for (item of item().items; track $index) {
      <div>
        <fuse-menu-item addictionalClass="pl-7" [item]="item" />
      </div>
    }
  </div>
}
