<!-- Overlay para mobile -->
@if (isOpen()) {
  <div
    class="lg:hidden fixed inset-0 bg-black/50 z-[60] transition-opacity"
    (click)="closeSidebar()"
  ></div>
}

<nav
  [ngClass]="{
    'compact-sidebar': compactMode(),
    'sidebar-open': isOpen()
  }"
  class="sidebar"
>
  <div class="h-full flex flex-col">
    <!-- Header com botão de fechar no mobile -->
    <div class="h-16 px-6 flex items-center justify-between border-b border-gray-200 dark:border-dark">
      <button
        target="_blank"
        rel="noopener noreferrer"
        (click)="onLogoClick()"
        class="flex items-center gap-3 flex-1"
      >
        <img
          alt="Acme"
          width="32"
          height="32"
          class="flex-shrink-0 hidden dark:block"
          src="https://kokonutui.com/logo.svg"
        />
        <img
          alt="Acme"
          width="32"
          height="32"
          class="flex-shrink-0 block dark:hidden"
          src="https://kokonutui.com/logo.svg"
        />
        <span class="text-lg font-semibold hover:cursor-pointer text-white"
          >Sellup</span
        >
      </button>
      <!-- Botão de fechar no mobile -->
      <button
        (click)="closeSidebar()"
        class="lg:hidden p-2 rounded-md text-white hover:bg-white/10 transition-colors"
        aria-label="Fechar menu"
      >
        <ng-icon name="lucideX" size="20" />
      </button>
    </div>

    <!-- Menu dinâmico -->
    <fuse-menu />

    <!-- Rodapé do menu -->
    <div class="px-4 py-4 border-t border-gray-200 dark:border-dark">
      <div class="space-y-1">
        <button
          (click)="settingsModal.open(); closeSidebar()"
          class="flex items-center px-3 py-2 text-sm rounded-md transition-colors text-white hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-dark w-full"
        >
          <ng-icon size="16" name="lucideSettings" class="mr-3" />
          Configurações
        </button>
        <a
          href="#"
          (click)="closeSidebar()"
          class="flex items-center px-3 py-2 text-sm rounded-md transition-colors text-white hover:text-gray-900 dark:hover:text-white hover:bg-gray-50 dark:hover:bg-dark"
        >
          <ng-icon size="16" name="lucideCircleHelp" class="mr-3" />
          Ajuda
        </a>
      </div>
    </div>
  </div>
</nav>
