<button (click)="toggleQuickAdmin()" class="header-button">
  <ng-icon
    name="lucideBadgePlus"
    class="text-xl text-gray-600 dark:text-gray-300 transition-all"
  />
</button>

<p-drawer
  #drawerRef
  [header]="title()"
  [visible]="show()"
  (onHide)="onCloseDrawer()"
  position="right"
  styleClass="!w-full md:!w-[80vw] lg:!w-[80vw]"
  transitionOptions="300ms cubic-bezier(0, 0, 0.2, 1)"
>
  <div>cadastro rapido</div>

  <ng-template #footer>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="submit"
        label="Cadastrar"
        icon="pi pi-check"
        class="w-full"
        severity="success"
      ></button>
    </div>
  </ng-template>
</p-drawer>
