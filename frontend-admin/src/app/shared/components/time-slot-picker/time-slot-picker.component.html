<p-button [label]="_timeSelected() ?? 'Selecione um horário'" (click)="showTimeSlots.set(!showTimeSlots())">
</p-button>

@if (showTimeSlots()) {
  <div class="time-slot-picker-container animate-fade-in" #scrollContainer>
    @for (slot of slots(); track slot.time) {
      <div 
        class="time-slot-picker-container--item" 
        [class.time-slot-picker-container--item--selected]="_timeSelected() === slot.time"
        [attr.data-time]="slot.time"
        (click)="selectSlot(slot)" 
        (keyup)="selectSlot(slot)" 
        (keydown)="selectSlot(slot)" 
        (keypress)="selectSlot(slot)"
      >{{ slot.time }}</div>
    }
  </div>
}
