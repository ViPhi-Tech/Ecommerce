<div
  #backdrop
  class="modal-backdrop fixed inset-0 z-9999 flex items-center justify-center py-8 px-4 bg-black/50"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="title() ? titleId() : null"
  tabindex="-1"
  (click)="onBackdropClick()"
  (keydown)="onEscapeKey($event)"
  [@backdropEnter]="closing() ? 'closing' : 'open'"
>
  <div
    class="w-full flex flex-col bg-white dark:bg-[#161b2e] border border-slate-200 dark:border-[#1e293b] rounded-xl shadow-2xl max-h-full overflow-hidden"
    [style.maxWidth]="maxWidth()"
    (click)="onContentClick($event)"
    (keydown)="onEscapeKey($event)"
    [@contentEnter]="closing() ? 'closing' : 'open'"
  >
    <!-- Header: default (title/subtitle/icon) ou conteúdo projetado em [modal-header] -->
    @if (title()) {
      <header
        class="flex-shrink-0 flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-[#1e293b]"
      >
        <div class="flex items-center gap-3">
          @if (icon()) {
            <div class="bg-primary/10 p-2 rounded-lg text-primary flex items-center justify-center">
              <ng-icon [name]="icon()" size="20" />
            </div>
          }
          <div>
            <h2
              [id]="titleId()"
              class="text-lg font-semibold tracking-tight text-slate-900 dark:text-white"
            >
              {{ title() }}
            </h2>
            @if (subtitle()) {
              <p class="text-xs text-slate-500 dark:text-slate-400">{{ subtitle() }}</p>
            }
          </div>
        </div>
        <a
          class="cursor-pointer p-2 rounded-lg text-slate-900 dark:text-white flex items-center justify-center hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
          (click)="closeModal()"
          (keyup)="closeModal()"
        >
          <ng-icon name="lucideX" size="20" />
      </a>
      </header>
    } @else {
      <div class="flex-shrink-0">
        <ng-content select="[modal-header]"></ng-content>
      </div>
    }

    <!-- Body: scrollável quando o conteúdo excede a altura disponível -->
    <div class="overflow-y-auto flex-1 min-h-0">
      <ng-content select="[modal-body]"></ng-content>
    </div>

    <!-- Footer: fixo na base -->
    <div class="flex-shrink-0">
      <ng-content select="[modal-footer]"></ng-content>
    </div>
  </div>
</div>
