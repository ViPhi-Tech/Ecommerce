<div class="text-editor">
  <div class="text-editor__toolbar">
    <button type="button" class="text-editor__btn" (click)="applyCommand('bold')" aria-label="Negrito">
      <strong>B</strong>
    </button>
    <button type="button" class="text-editor__btn" (click)="applyCommand('italic')" aria-label="Itálico">
      <em>I</em>
    </button>
    <button type="button" class="text-editor__btn" (click)="applyCommand('underline')" aria-label="Sublinhado">
      <u>U</u>
    </button>
    <button type="button" class="text-editor__btn" (click)="insertLink()" aria-label="Inserir link">
      <i class="pi pi-link"></i>
    </button>
  </div>

  <div
    #editorRef
    class="text-editor__content"
    [ngClass]="{ 'text-editor__content--focused': isFocused }"
    contenteditable="true"
    role="textbox"
    aria-multiline="true"
    (blur)="isFocused = false; handleInput()"
    (input)="handleInput()"
    (paste)="onPaste($event)"
    [attr.data-placeholder]="placeholder"
  ></div>
</div>
