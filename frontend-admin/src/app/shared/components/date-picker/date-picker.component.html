<button #triggerButton type="button" class="date-picker-button" (click)="openPanel()">
  {{ displayText() }}
</button>

@if (showPanel()) {
  <div class="date-picker-overlay" (click)="closePanel()">
    <div
      class="date-picker-panel animate-fade-in"
      [style.top.px]="panelPosition().top"
      [style.left.px]="panelPosition().left"
      (click)="$event.stopPropagation()"
    >
      <p-datepicker
      [ngModel]="internalDate()"
      (ngModelChange)="onDateChange($event)"
      [inline]="true"
      [dateFormat]="dateFormat()"
      [minDate]="minDate() ?? undefined"
      [maxDate]="maxDate() ?? undefined"
      [showIcon]="false"
      />
    </div>
  </div>
}
