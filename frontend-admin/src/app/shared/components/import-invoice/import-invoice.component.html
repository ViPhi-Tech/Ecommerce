<p-dialog
  #dialogRef
  [header]="title()"
  [(visible)]="visible"
  [draggable]="false"
  (onHide)="onCloseDialog()"
  [modal]="true"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  [closable]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '80vw' }"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-lg font-semibold leading-none tracking-tight">
        {{ title() }}
      </h2>
      <p class="text-sm text-muted-foreground">
        {{ subtitle() }}
      </p>
    </div>
  </ng-template>

  <div>
    @if (!invoice() && !loading()) {
      <fuse-file-upload (uploadedFilesEvent)="onUpload($event)" />
    }

    @if (loading()) {
      <p>Carregando...</p>
    }

    @if (invoice() && !loading()) {
      <fuse-invoice-details [invoice]="invoice()" />
    }
  </div>

  <ng-template #footer>
    @if (invoice()) {
      <div class="w-full flex flex-col sm:flex-row justify-end items-stretch sm:items-center gap-2 sm:gap-4">
        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          [outlined]="true"
          (click)="closeDialog()"
          severity="secondary"
          class="w-full sm:w-[200px] order-2 sm:order-1"
          size="small"
        ></button>
        <button
          pButton
          type="submit"
          label="Importar"
          icon="pi pi-check"
          class="w-full sm:w-[200px] order-1 sm:order-2"
          size="small"
          (click)="import()"
        ></button>
      </div>
    }
  </ng-template>
</p-dialog>
