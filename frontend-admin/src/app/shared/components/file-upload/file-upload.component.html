<div>
  <p-fileUpload
    #fileUploader
    name="demo[]"
    cancelLabel="Cancelar"
    chooseLabel="Escolher"
    uploadLabel="Escolher"
    [accept]="accept()"
    (onUpload)="onUpload($event)"
    [customUpload]="true"
    [multiple]="multiple()"
    (onSelect)="onUpload($event)"
    [showUploadButton]="true"
    [showCancelButton]="false"
    [auto]="true"
    class="w-full"
  >
    <ng-template
      pTemplate="header"
      let-files
      let-chooseCallback="chooseCallback"
      let-clearCallback="clearCallback"
      let-uploadCallback="uploadCallback"
    >
      <button
        (click)="choose($event, chooseCallback)"
        class="flex items-center justify-center w-full"
      >
        <label for="nfe-file" class="fuse-file-upload"
          ><div class="flex flex-col items-center justify-center pt-5 pb-6">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-upload w-8 h-8 mb-2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" x2="12" y1="3" y2="15"></line>
            </svg>
            <p class="mb-2 text-sm">
              <span class="font-semibold">Clique para fazer upload</span> ou
              arraste e solte
            </p>
            <p class="text-xs">XML (Máximo 10MB)</p>
          </div>
          <input
            class="h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 hidden"
            id="nfe-file"
            accept=".xml"
            type="file"
        /></label>
      </button>
    </ng-template>

    @if (uploadedFiles().length) {
      <ng-template pTemplate="content">
        @if (!loading) {
          <button
            class="w-full py-3"
            style="cursor: copy"
            (click)="fileUploader.advancedFileInput.nativeElement.click()"
          >
            <div
              *ngIf="!uploadedFiles()?.length || multiple()"
              class="h-full flex flex-column justify-content-center align-items-center"
            >
              <i class="pi pi-upload text-900 text-xs mb-2"></i>
              <span class="font-bold text-900 text-xs mb-1"
                >Upload de arquivos</span
              >
              <span class="font-medium text-600 text-xs text-center"
                >Arraste ou selecione um arquivo(s)</span
              >
            </div>
          </button>
        }
        @if (loading()) {
          <div class="flex justify-content-center align-items-center p-3">
            <img
              src="assets/loader/loader-pdv.gif"
              width="100"
              alt="Loading animation"
            />
          </div>
        } @else {
          @if (uploadedFiles().length) {
            <div class="flex justify-content-center flex-wrap gap-5">
              <div
                *ngFor="let file of uploadedFiles()"
                class="row w-full flex align-items-center"
              >
                <div class="col-3">
                  <img
                    [src]="file.file"
                    [alt]="file.name"
                    class="w-full h-full border-round shadow-2 max-width"
                  />
                </div>
                <div
                  class="col-5 p-fileupload-filename text-limite-personalizado"
                >
                  {{ file.name }}
                </div>
                <div class="col-2">{{ file.size }}</div>
                <div class="col-2 flex justify-content-center">
                  <button
                    type="button"
                    class="p-element p-button-icon-only p-button p-component"
                    (click)="deleteFile($event, file)"
                  >
                    <span class="p-button-icon p-c pi pi-times"></span>
                  </button>
                </div>
              </div>
            </div>
          }
        }
      </ng-template>
    }
  </p-fileUpload>
</div>
