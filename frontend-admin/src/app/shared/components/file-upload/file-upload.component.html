<div>
  <p-fileUpload
    #fileUploader
    name="demo[]"
    cancelLabel="Cancelar"
    chooseLabel="Escolher"
    uploadLabel="Escolher"
    [accept]="accept()"
    (onUpload)="onTemplatedUpload()"
    (onSelect)="onSelectedFiles($event)"
    [customUpload]="true"
    [multiple]="multiple()"
    [showUploadButton]="true"
    [showCancelButton]="false"
    [auto]="true"
    class="w-full"
  >
    <ng-template
      #header
      let-files
      let-chooseCallback="chooseCallback"
      let-clearCallback="clearCallback"
      let-uploadCallback="uploadCallback"
    >
      <button
        (click)="choose($event, chooseCallback)"
        class="flex items-center justify-center w-full"
      >
        <label for="nfe-file" class="fuse-file-upload"
          ><div class="flex flex-col items-center justify-center pt-5 pb-6">
            <ng-icon size="48" name="lucideCloudUpload" />
            <p class="mb-2 text-sm">
              <span class="font-semibold">Clique para fazer upload</span> ou
              arraste e solte
            </p>
            <p class="text-xs">XML (Máximo 10MB)</p>
          </div>
        </label>
      </button>
    </ng-template>

    <ng-template
      #content
      let-files
      let-uploadedFiles="uploadedFiles"
      let-removeFileCallback="removeFileCallback"
      let-removeUploadedFileCallback="removeUploadedFileCallback"
    >
      <div class="flex flex-col gap-8 pt-4">
        @if (files.length > 0) {
          <div>
            <h5>Pendente</h5>
            <div class="flex flex-wrap gap-4">
              @for (file of files; track $index) {
                <div
                  class="p-8 rounded-border flex flex-col border border-surface items-center gap-4"
                >
                  <div>
                    <img
                      role="presentation"
                      [alt]="file.name"
                      [src]="file.objectURL"
                      width="100"
                      height="50"
                    />
                  </div>
                  <span
                    class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden"
                    >{{ file.name }}</span
                  >
                  <div>{{ formatSize(file.size) }}</div>
                  <p-badge value="Pendente" severity="warn" />
                  <p-button
                    icon="pi pi-times"
                    (click)="
                      onRemoveTemplatingFile(
                        $event,
                        file,
                        removeFileCallback,
                        $index
                      )
                    "
                    [outlined]="true"
                    [rounded]="true"
                    severity="danger"
                  />
                </div>
              }
            </div>
          </div>
        }
        @if (uploadedFiles.length > 0) {
          <div>
            <h5>Completed</h5>
            <div class="flex flex-wrap gap-4">
              @for (file of uploadedFiles; track $index) {
                <div
                  class="card m-0 px-12 flex flex-col border border-surface items-center gap-4"
                >
                  <div>
                    <img
                      role="presentation"
                      [alt]="file.name"
                      [src]="file.objectURL"
                      width="100"
                      height="50"
                    />
                  </div>
                  <span
                    class="font-semibold text-ellipsis max-w-60 whitespace-nowrap overflow-hidden"
                    >{{ file.name }}</span
                  >
                  <div>{{ formatSize(file.size) }}</div>
                  <p-badge value="Enviado" class="mt-4" severity="success" />
                  <p-button
                    icon="pi pi-times"
                    (onClick)="removeUploadedFileCallback($index)"
                    [outlined]="true"
                    [rounded]="true"
                    severity="danger"
                  />
                </div>
              }
            </div>
          </div>
        }
      </div>
    </ng-template>
    <ng-template #file></ng-template>
  </p-fileUpload>
</div>
