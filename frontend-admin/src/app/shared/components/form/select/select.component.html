<div class="w-full label-position {{ labelPosition() }}">
  @if (!isLoading()) {
    @if (label()) {
      <label for="icondisplay" class="label">
        {{ label() }}
        @if (isRequired()) {
          <span class="text-red-500">*</span>
        }
      </label>
    }
    <div class="flex items-center">
      <p-select
        [options]="items()"
        [size]="size()"
        [formControl]="control()"
        [optionLabel]="labelRef()"
        [optionValue]="valueRef()"
        [placeholder]="placeholder()"
        [filter]="canSearch()"
        [filterBy]="labelRef()"
        appendTo="body"
        [class]="addictionalPrimeClass()"
        [styleClass]="addictionalClass()"
        (onChange)="onChange($event)"
        class="animate-fadein"
      >
        @if (quickAdd().length > 0) {
          <ng-template #footer>
            <div class="p-3">
              <p-button
                (onClick)="redirectToQuickAdd()"
                label="Adicionar"
                fluid
                severity="secondary"
                size="small"
              >
                <ng-icon name="lucideBadgePlus" />
              </p-button>
            </div>
          </ng-template>
        }
      </p-select>
    </div>
  } @else {
    <p-skeleton height="1rem" styleClass="mb-2" width="100px" />
    <p-skeleton height="2rem" styleClass="mb-2" width="100%" />
  }
</div>
