<div class="w-full label-position {{ labelPosition() }} flex flex-col gap-1">
  @if (label()) {
    <label
      [for]="idRef()"
      class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 mb-2"
    >
      {{ label() }}
    </label>
  }

  @if (type() === 'text') {
    <input
      pInputText
      [formControl]="control()"
      class="{{ addictionalClass() }}"
      [pSize]="size()"
      [placeholder]="placeholder()"
      [id]="idRef()"
      [name]="idRef()"
    />
  }

  @if (type() === 'number') {
    <input
      type="number"
      pInputText
      [formControl]="control()"
      [pSize]="size()"
      [placeholder]="placeholder()"
      [id]="idRef()"
      [name]="idRef()"
      [step]="step()"
    />
  }

  @if (type() === 'password') {
    <p-password
      [formControl]="control()"
      styleClass="w-full"
      [size]="size()"
      [id]="idRef()"
      [feedback]="feedback()"
    />
  }

  @if (type() === 'price') {
    <p-inputnumber
      [formControl]="control()"
      inputId="{{ idRef() }}"
      mode="currency"
      currency="BRL"
      [size]="size()"
      locale="pt-BR"
    />
  }

  @if (type() === 'textarea') {
    <textarea
      pTextarea
      [formControl]="control()"
      [placeholder]="placeholder()"
      [id]="idRef()"
      [name]="idRef()"
      [rows]="rows()"
    ></textarea>
  }
</div>

@if (
  errorMessage() && control().invalid && (control().dirty || control().touched)
) {
  <p-message
    severity="error"
    icon="pi pi-times-circle"
    styleClass="mt-2"
    size="small"
  >
    {{ errorMessage() }}
  </p-message>
}
