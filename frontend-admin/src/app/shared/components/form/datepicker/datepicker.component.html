<div class="w-full label-position {{ labelPosition() }}">
  @if (label()) {
    <label
      [for]="idRef()"
      class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-right"
    >
      {{ label() }}
    </label>
  }
  @if (type() === 'date') {
    <p-datepicker
      [formControl]="control()"
      class="w-full {{ addictionalClassPrime() }}"
      styleClass="w-full {{ addictionalClass() }}"
      [placeholder]="placeholder()"
      [iconDisplay]="'input'"
      [showIcon]="true"
      appendTo="body"
      [inputId]="idRef()"
      [size]="size()"
    />
  }
  @if (type() === 'time') {
    <p-datepicker
      [formControl]="control()"
      class="w-full {{ addictionalClassPrime() }}"
      styleClass="w-full {{ addictionalClass() }}"
      [placeholder]="placeholder()"
      [iconDisplay]="'input'"
      [showIcon]="true"
      [timeOnly]="true"
      appendTo="body"
      [inputId]="idRef()"
      [size]="size()"
    >
      <ng-template #inputicon let-clickCallBack="clickCallBack">
        <i class="pi pi-clock"></i>
      </ng-template>
    </p-datepicker>
  }
</div>
