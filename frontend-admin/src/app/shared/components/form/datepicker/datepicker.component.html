<div class="flex flex-col gap-1 label-position w-full {{ labelPosition() }}">
  @if (label()) {
    <label [for]="idRef()" class="label">
      {{ label() }}
      @if (isRequired()) {
        <span class="text-red-500 lh-0">*</span>
      }
    </label>
  }
  @if (type() === 'date' && !isLoading()) {
    <p-datepicker
      [formControl]="control()"
      class="w-full {{ addictionalClassPrime() }}"
      styleClass="w-full {{ addictionalClass() }}"
      [placeholder]="placeholder()"
      [iconDisplay]="'input'"
      [showIcon]="true"
      appendTo="body"
      [inputId]="idRef()"
      [size]="size()"
      [maxDate]="maxDate()"
      dateFormat="dd/mm/yy"
    />
  }
  @if (type() === 'time' && !isLoading()) {
    <p-datepicker
      [formControl]="control()"
      class="w-full {{ addictionalClassPrime() }}"
      styleClass="w-full {{ addictionalClass() }}"
      [placeholder]="placeholder()"
      [iconDisplay]="'input'"
      [showIcon]="true"
      [timeOnly]="true"
      appendTo="body"
      [inputId]="idRef()"
      [size]="size()"
      dateFormat="dd/mm/yy"
    >
      <ng-template #inputicon let-clickCallBack="clickCallBack">
        <i class="pi pi-clock"></i>
      </ng-template>
    </p-datepicker>
  }
</div>
