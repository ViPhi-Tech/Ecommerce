<div class="flex flex-col gap-1 label-position w-full {{ labelPosition() }}">
  @if (label()) {
    <label [for]="idRef()" class="label flex justify-between">
      {{ label() }}
      @if (isRequired() && control().invalid) {
        <span class="text-red-500 flex">
          <p>*</p>   
          <p class="text-xs">Obrigatório</p>
        </span>
      }
    </label>
  }
  @if (type() === 'date' && !isLoading()) {
    <p-datepicker
      [formControl]="control()"
      class="w-full {{ addictionalClassPrime() }}"
      styleClass="w-full {{ addictionalClass() }}"
      [placeholder]="placeholder()"
      [iconDisplay]="'input'"
      [showIcon]="true"
      appendTo="body"
      dataType="string"
      [inputId]="idRef()"
      [size]="size()"
      [maxDate]="maxDate()"
      dateFormat="dd/mm/yy"
      [required]="isRequired()"
    />
  }
  @if (type() === 'time' && !isLoading()) {
    <p-datepicker
      [formControl]="control()"
      class="w-full {{ addictionalClassPrime() }}"
      styleClass="w-full {{ addictionalClass() }}"
      [placeholder]="placeholder()"
      [iconDisplay]="'input'"
      [showIcon]="true"
      [timeOnly]="true"
      appendTo="body"
      [inputId]="idRef()"
      dataType="string"
      [size]="size()"
      dateFormat="dd/mm/yy"
      (onSelect)="onTimeSelect($event)"
      [required]="isRequired()"
    >
      <ng-template #inputicon let-clickCallBack="clickCallBack">
        <i class="pi pi-clock"></i>
      </ng-template>
    </p-datepicker>
  }
</div>
