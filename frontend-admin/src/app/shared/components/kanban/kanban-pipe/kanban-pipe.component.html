<div class="kanban-pipe" [ngClass]="columnColorClass()">
  <!-- Header da Coluna -->
  <div class="pipe-header" [ngClass]="headerColorClass()">
    <div class="flex items-center justify-between p-3">
      <div class="flex items-center gap-2">
        <h3 class="font-semibold text-gray-800 dark:text-gray-200">
          {{ column().title }}
        </h3>
        <span
          class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs px-2 py-1 rounded-full"
        >
          {{ cardCount() }}
        </span>
        @if (hasMaxCards()) {
          <span
            class="bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-xs px-2 py-1 rounded-full"
          >
            Máx
          </span>
        }
      </div>

      <button
        (click)="toggleCollapse()"
        class="p-1 hover:bg-gray-200 dark:hover:bg-gray-700 rounded transition-colors"
        type="button"
      >
        <ng-icon
          [name]="isCollapsed() ? 'lucideChevronDown' : 'lucideChevronUp'"
          class="w-4 h-4 text-gray-500"
        ></ng-icon>
      </button>
    </div>
  </div>

  <div class="d-flex text-center">
    @if (column().filter?.date) {
      <fuse-period
        [availablePeriods]="[
          'all',
          'today',
          'yesterday',
          'last7days',
          'last15days',
          'last30days',
          'currentMonth',
        ]"
        [storeKey]="column().id + '_period'"
        [placeholder]="'Selecione o período'"
        [defaultValue]="'last30days'"
        (periodChange)="onPeriodChange($event)"
        [firstEmit]="false"
      />
    }
  </div>

  <!-- Área de Drop dos Cards -->
  @if (!isCollapsed()) {
    <div
      class="pipe-content"
      cdkDropList
      [id]="column().id"
      [cdkDropListData]="column().cards"
      (cdkDropListDropped)="onCardDrop($event)"
      [cdkDropListDisabled]="!allowDragDrop()"
    >
      @if (column().cards.length === 0) {
        <div class="empty-state">
          <div
            class="text-gray-400 dark:text-gray-500 text-sm text-center py-8"
          >
            <ng-icon name="lucideInbox" class="w-8 h-8 mx-auto mb-2"></ng-icon>
            <p>Nenhum card nesta coluna</p>
          </div>
        </div>
      } @else {
        @for (card of column().cards; track card.id) {
          <div
            cdkDrag
            [cdkDragData]="card"
            [cdkDragDisabled]="!allowDragDrop()"
            class="card-item"
          >
            <fuse-kanban-card
              [card]="card"
              [height]="cardHeight()"
              [allowDrag]="allowDragDrop()"
              [actions]="column().cardsActions || []"
              (cardClick)="onCardClick(card)"
            ></fuse-kanban-card>
          </div>
        }
      }
    </div>
  }
</div>
