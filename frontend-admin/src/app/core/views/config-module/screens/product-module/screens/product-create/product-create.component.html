<p-drawer
  #drawerRef
  [visible]="visible()"
  (onHide)="onCloseDrawer()"
  position="right"
  styleClass="!w-full md:!w-[80vw] lg:!w-[80vw]"
  transitionOptions="300ms cubic-bezier(0, 0, 0.2, 1)"
>
  <ng-template #header>
    <div class="flex flex-col space-y-1.5 text-center sm:text-left">
      <h2 class="text-2xl font-semibold leading-none tracking-tight">
        {{title()}}
      </h2>
      <p class="text-sm text-muted-foreground">
        Preencha os dados do novo produto abaixo
      </p>
    </div>
  </ng-template>

  <form class="flex flex-col gap-4">
    <div>
      <form [formGroup]="productForm" class="row">
        <div class="col-12 md:col-12 mb-6">
          <fuse-input
            label="Nome do Produto"
            [control]="productForm.get('name')"
            placeholder="Ex: Smartphone Galaxy S22 Ultra"
          />
        </div>

        <div class="col-12 md:col-6 mb-6">
          <fuse-input
            label="Ean"
            type="number"
            [control]="productForm.get('ean')"
            placeholder="Ex: 7891234567890"
          />
        </div>

        <div class="col-12 md:col-6 mb-6">
          <fuse-input
            label="Código/SKU"
            [control]="productForm.get('sku')"
            placeholder="Ex: SM-S22U-256GB-BLK"
          />
        </div>

        <div class="col-12 md:col-6 mb-6">
          <fuse-input
            label="Categoria"
            [control]="productForm.get('category')"
            placeholder="Adicione uma cetegoria"
          />
        </div>

        <div class="col-12 md:col-6 mb-6">
          <fuse-input
            label="Marca / Fabricante"
            [control]="productForm.get('brand')"
            placeholder="Ex: Samsung"
          />
        </div>

        <div class="col-12 md:col-6 mb-6">
          <fuse-input
            type="price"
            label="Preço inicial"
            [control]="productForm.get('initialPrice')"
            placeholder="R$ 0,00"
          />
        </div>

        <div class="col-12 md:col-6 mb-6">
          <fuse-input
            type="price"
            label="Preço final"
            [control]="productForm.get('finalPrice')"
            placeholder="R$ 0,00"
          />
        </div>

        <div class="col-12 md:col-6 mb-6">
          <fuse-input
            label="Estoque disponível"
            type="number"
            [control]="productForm.get('stock')"
            placeholder="Adicione a quantidade disponível"
          />
        </div>

        <div class="col-12 mb-6">
          <fuse-input
            type="textarea"
            label="Descrição curta"
            [control]="productForm.get('shortDescription')"
            placeholder="Breve descrição do produto (máx. 255 caracteres)"
          />
        </div>

        <div class="col-12 mb-6">
          <fuse-input
            type="textarea"
            label="Descrição"
            [rows]="5"
            [control]="productForm.get('description')"
            placeholder="Descrição detalhada do produto, características, benefícios, etc."
          />
        </div>
      </form>
      <!-- <fuse-section title="Informações Básicas do Produto">
      </fuse-section> -->
    </div>
  </form>

  <ng-template #footer>
    <div class="w-full justify-end flex items-center gap-4">
      <div class="flex gap-2">
        <button
          pButton
          type="submit"
          [label]="submitButtonLabel()"
          icon="pi pi-check"
          class="w-[200px]"
          size="small"
          (click)="onSubmit($event)"
        ></button>

        <button
          pButton
          type="button"
          label="Cancelar"
          icon="pi pi-times"
          (click)="closeDrawer($event)"
          severity="secondary"
          class="w-[200px]"
          size="small"
        ></button>
      </div>
    </div>
  </ng-template>
</p-drawer>

<p-toast baseZIndex="9000"/>
