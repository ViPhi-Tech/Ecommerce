<div class="p-8 animate-fade-in">
  <form class="flex flex-col gap-4 mt-3 scroll-form">
    <div>
      <form [formGroup]="productForm" class="row space-y-4">
        <div class="col-12 md:col-12">
          <fuse-input
            [isLoading]="isLoading()"
            label="Nome do Produto"
            [control]="productForm.get('name')"
            placeholder="Ex: Smartphone Galaxy S22 Ultra"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Ean"
            type="number"
            [control]="productForm.get('ean')"
            placeholder="Ex: 7891234567890"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Código/SKU"
            [control]="productForm.get('sku')"
            placeholder="Ex: SM-S22U-256GB-BLK"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-select
            label="Categoria"
            [items]="categoryState.categoryList()"
            valueRef="id"
            labelRef="name"
            [isLoading]="isLoading()"
            [quickAdd]="['categories', 'new']"
            [control]="productForm.get('categoryId')"
            placeholder="Adicione uma cetegoria"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Marca / Fabricante"
            [control]="productForm.get('brand')"
            placeholder="Ex: Samsung"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            type="price"
            label="Preço de custo"
            [min]="1"
            [control]="productForm.get('initialPrice')"
            placeholder="R$ 0,00"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            type="price"
            label="Preço de venda"
            [control]="productForm.get('finalPrice')"
            placeholder="R$ 0,00"
          />
        </div>

        <div class="col-12 md:col-6">
          <fuse-input
            [isLoading]="isLoading()"
            label="Estoque inicial"
            type="number"
            [control]="productForm.get('quantity')"
            placeholder="Adicione a quantidade inicial em estoque"
          />
        </div>

        <div class="col-12">
          <fuse-input
            [isLoading]="isLoading()"
            type="textarea"
            label="Descrição curta"
            [control]="productForm.get('shortDescription')"
            placeholder="Breve descrição do produto (máx. 255 caracteres)"
          />
        </div>

        <div class="col-12">
          <fuse-input
            [isLoading]="isLoading()"
            type="textarea"
            label="Descrição"
            [rows]="5"
            [control]="productForm.get('description')"
            placeholder="Descrição detalhada do produto, características, benefícios, etc."
          />
        </div>
      </form>
      <!-- <fuse-section title="Informações Básicas do Produto">
        </fuse-section> -->
    </div>
  </form>

  <div class="w-full justify-end flex items-center gap-4 mt-4">
    <div class="flex gap-2">
      <button
        pButton
        type="submit"
        [label]="submitButtonLabel()"
        icon="pi pi-check"
        class="w-[200px]"
        size="small"
        (click)="onSubmit($event)"
      ></button>

      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        (click)="back()"
        severity="secondary"
        class="w-[200px]"
        size="small"
      ></button>
    </div>
  </div>
</div>


<p-toast baseZIndex="9000" />
