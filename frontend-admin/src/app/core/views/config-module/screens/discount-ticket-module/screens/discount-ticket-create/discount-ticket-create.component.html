<p-dialog
  #dialogRef
  [header]="title()"
  [(visible)]="visible"
  [draggable]="false"
  (onHide)="onHide()"
  [modal]="true"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  [closable]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '30vw' }"
>
  <form class="flex flex-col gap-4">
    <div class="grid gap-4 py-4">
      <div>
        <fuse-input label="Código" labelPosition="left" />
      </div>
      <div>
        <fuse-select label="Tipo" labelPosition="left" />
      </div>
      <div>
        <fuse-input label="Valor" labelPosition="left" />
      </div>
      <div>
        <fuse-datepicker
          label="Data Inicial"
          placeholder="DD/MM/YYYY"
          labelPosition="left"
        />
      </div>
      <div>
        <fuse-datepicker
          label="Data Final"
          placeholder="DD/MM/YYYY"
          labelPosition="left"
        />
      </div>
      <div>
        <fuse-input label="Limite de Uso" labelPosition="left" />
      </div>
      <div>
        <fuse-input label="Ativo" labelPosition="left" />
      </div>
    </div>
  </form>

  <ng-template #footer>
    <div class="flex items-center gap-2">
      <button
        pButton
        type="submit"
        label="Cadastrar"
        icon="pi pi-check"
        class="w-full"
        severity="success"
      ></button>
      <button
        pButton
        type="button"
        label="Cancelar"
        icon="pi pi-times"
        class="w-full"
        (click)="closeDialog()"
        severity="danger"
      ></button>
    </div>
  </ng-template>
</p-dialog>
