# Arquivo de configuração do Nginx

# Bloco de eventos
events {
    worker_connections 1024;  # Número de conexões simultâneas que cada worker pode atender
}

# Bloco http
http {
    # Bloco de configuração do servidor
    server {
        listen 80;  # Nginx escutando na porta 80
        server_name ecommerce;

        # Redireciona todas as requisições para o frontend
        location / {
            proxy_pass http://frontend:3000;  # Frontend (Next.js) está na porta 3000 no contêiner frontend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redireciona as requisições para a API para o backend
        location /api/ {
            proxy_pass http://backend:8000;  # Backend (FastAPI) está na porta 8000 no contêiner backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
