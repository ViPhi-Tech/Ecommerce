# ARQUIVO: nginx/default.conf (VERSÃO CORRIGIDA FINAL)

server {
    listen 80;
    server_name localhost;

    # ====================================================================
    # CORREÇÃO: 'root' e 'index' movidos para o nível do servidor.
    # Agora eles se aplicam a todos os blocos 'location' abaixo.
    # ====================================================================
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Bloco para servir a aplicação Angular.
    location / {
        # Esta linha é específica para o roteamento de SPAs e permanece aqui.
        try_files $uri $uri/ /index.html;
    }

    location /admin {
        try_files $uri $uri/ /index.html;
    }
    
    # Bloco para redirecionar as chamadas de API para o container do backend.
    location /api/ {
        # O nome 'backend' funciona porque é o nome do serviço no docker-compose.
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Bloco para redirecionar para a documentação do backend.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Logs de acesso e erro.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
