# ARQUIVO: nginx/default.conf (VERSÃO CORRIGIDA FINAL)

server {
    listen 80;
    server_name localhost;

    # ====================================================================
    # CORREÇÃO: 'root' e 'index' movidos para o nível do servidor.
    # Agora eles se aplicam a todos os blocos 'location' abaixo.
    # ====================================================================
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Bloco para servir a aplicação Angular.
    location / {
        # Esta linha é específica para o roteamento de SPAs e permanece aqui.
        try_files $uri $uri/ /index.html;
        
        # Headers para evitar cache (será sobrescrito por regras específicas abaixo)
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # # Cache para arquivos estáticos com hash (JS, CSS, imagens)
    # # Esses arquivos já têm hash no nome, então podem ser cacheados
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    # }
    
    # Não fazer cache do index.html especificamente
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Last-Modified "";
        add_header ETag "";
    }
    
    # Não fazer cache de arquivos de configuração
    location ~* \.(json|webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /admin {
        try_files $uri $uri/ /index.html;
    }
    
    # Bloco para redirecionar as chamadas de API para o container do backend.
    location /api/ {
        # O nome 'backend' funciona porque é o nome do serviço no docker-compose.
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Bloco para redirecionar para a documentação do backend.
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Logs de acesso e erro.
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
